{{- if .Values.harnessGatewayOverlay.enabled }}
{{- $inventory := include "harness-gateway-api.inventory" . | fromJson }}
{{- $tlsSecrets := get $inventory "tlsSecrets" }}
{{- if $tlsSecrets }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: {{ include "harness-gateway-api.referenceGrantName" . | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "harness-gateway-api.labels" . | nindent 4 }}
  annotations:
    harness-gateway-api.io/routing-contract-sha256: {{ dig "source" "routingContractSha256" "" $inventory | quote }}
spec:
  # Authorize only TLS Secrets discovered from the rendered Ingress contract.
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: {{ include "harness-gateway-api.gatewayNamespace" . | quote }}
  to:
    {{- range ($tlsSecrets | uniq | sortAlpha) }}
    - group: ""
      kind: Secret
      name: {{ . | quote }}
    {{- end }}
{{- end }}
{{- end }}
