{{- if .Values.gatewayTransition.enabled }}
{{- $routes := required "gatewayTransition.discoveredRoutes must be generated before rendering" .Values.gatewayTransition.discoveredRoutes }}
{{- if eq (len $routes) 0 }}
{{- fail "gatewayTransition.discoveredRoutes is empty" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: {{ .Values.gatewayTransition.listenerSet.name }}
  namespace: {{ .Values.gatewayTransition.listenerSet.namespace }}
  labels:
    {{- include "harness-gateway-transition.labels" . | nindent 4 }}
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ .Values.gatewayTransition.gateway.name }}
    namespace: {{ .Values.gatewayTransition.gateway.namespace }}
  listeners:
    {{- $seen := dict }}
    {{- range $route := $routes }}
    {{- $listenerKey := printf "%s|%s|%s" $route.hostname $route.tls.secretNamespace $route.tls.secretName }}
    {{- if not (hasKey $seen $listenerKey) }}
    {{- $_ := set $seen $listenerKey true }}
    - name: {{ include "harness-gateway-transition.listenerName" $route }}
      hostname: {{ $route.hostname | quote }}
      protocol: HTTPS
      port: {{ $.Values.gatewayTransition.listenerSet.port }}
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: {{ $route.tls.secretName }}
            namespace: {{ $route.tls.secretNamespace }}
      allowedRoutes:
        namespaces:
          from: {{ $.Values.gatewayTransition.listenerSet.allowedRoutesNamespacesFrom }}
    {{- end }}
    {{- end }}
{{- end }}
