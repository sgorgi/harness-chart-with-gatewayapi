{{- if .Values.harnessGatewayOverlay.enabled }}
{{- $inventory := include "harness-gateway-api.inventory" . | fromJson }}
{{- with (get $inventory "listeners") }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: {{ include "harness-gateway-api.listenerSetName" $ | quote }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    {{- include "harness-gateway-api.labels" $ | nindent 4 }}
  annotations:
    harness-gateway-api.io/routing-contract-sha256: {{ dig "source" "routingContractSha256" "" $inventory | quote }}
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ include "harness-gateway-api.gatewayName" $ | quote }}
    namespace: {{ include "harness-gateway-api.gatewayNamespace" $ | quote }}
  listeners:
    {{- range . }}
    - name: {{ .name | quote }}
      hostname: {{ .hostname | quote }}
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: {{ .tlsSecret | quote }}
      allowedRoutes:
        namespaces:
          from: Same
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
    {{- end }}
{{- end }}
{{- end }}
