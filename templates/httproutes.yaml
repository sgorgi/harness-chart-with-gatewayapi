{{- if .Values.gatewayTransition.enabled }}
{{- range $route := .Values.gatewayTransition.discoveredRoutes }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "harness-gateway-transition.routeName" $route }}
  namespace: {{ $route.namespace }}
  labels:
    {{- include "harness-gateway-transition.labels" $ | nindent 4 }}
    gateway.harness.io/source-ingress: {{ $route.source.ingressName | quote }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: {{ $.Values.gatewayTransition.listenerSet.name }}
      namespace: {{ $.Values.gatewayTransition.listenerSet.namespace }}
      sectionName: {{ include "harness-gateway-transition.listenerName" $route }}
  hostnames:
    - {{ $route.hostname | quote }}
  rules:
    {{- range $rule := $route.rules }}
    - matches:
        - path:
            type: {{ include "harness-gateway-transition.pathType" $rule.pathType }}
            value: {{ $rule.path | quote }}
      backendRefs:
        - group: ""
          kind: Service
          name: {{ $rule.backend.serviceName }}
          port: {{ $rule.backend.servicePort }}
          weight: 1
    {{- end }}
{{- end }}
{{- end }}
