{{- if and .Values.gatewayTransition.enabled .Values.gatewayTransition.referenceGrant.enabled }}
{{- $seen := dict }}
{{- range $route := .Values.gatewayTransition.discoveredRoutes }}
{{- $grantKey := printf "%s|%s" $route.tls.secretNamespace $route.tls.secretName }}
{{- if not (hasKey $seen $grantKey) }}
{{- $_ := set $seen $grantKey true }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: {{ include "harness-gateway-transition.dnsName" (printf "allow-%s-%s" $.Values.gatewayTransition.listenerSet.name $route.tls.secretName) }}
  namespace: {{ $route.tls.secretNamespace }}
  labels:
    {{- include "harness-gateway-transition.labels" $ | nindent 4 }}
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      namespace: {{ $.Values.gatewayTransition.listenerSet.namespace }}
  to:
    - group: ""
      kind: Secret
      name: {{ $route.tls.secretName }}
{{- end }}
{{- end }}
{{- end }}
