{{- if and .Values.harnessGatewayOverlay.enabled .Values.harnessGatewayOverlay.ciliumNetworkPolicy.enabled }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "harness-gateway-api.ciliumNetworkPolicyName" . | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "harness-gateway-api.labels" . | nindent 4 }}
spec:
  description: Allow the apps-gateway Envoy data plane to reach Harness backends
  # The Harness workloads use different labels and ports. Keep this additive
  # policy disabled until the existing default-deny policies have been checked.
  endpointSelector: {}
  enableDefaultDeny:
    ingress: false
  ingress:
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": {{ include "harness-gateway-api.gatewayNamespace" . | quote }}
            "k8s:gateway.envoyproxy.io/owning-gateway-name": {{ include "harness-gateway-api.gatewayName" . | quote }}
            "k8s:gateway.envoyproxy.io/owning-gateway-namespace": {{ include "harness-gateway-api.gatewayNamespace" . | quote }}
{{- end }}
