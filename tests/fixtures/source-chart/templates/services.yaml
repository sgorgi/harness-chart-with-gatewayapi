apiVersion: v1
kind: Service
metadata:
  name: harness-api
spec:
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: harness-optional
spec:
  ports:
    - name: http
      port: {{ .Values.optionalService.port }}
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: looker-web
spec:
  ports:
    - name: web
      port: 9999
      targetPort: web
---
apiVersion: v1
kind: Service
metadata:
  name: looker-api
spec:
  ports:
    - name: api
      port: 19999
      targetPort: api
