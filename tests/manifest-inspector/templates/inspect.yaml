{{- $manifest := required "manifest must be supplied with --set-file" .Values.manifest -}}
{{- $mode := .Values.mode | default "manifest" -}}
{{- $targetListenerSet := .Values.targetListenerSet | default "harness-listeners" -}}
{{- $parts := regexSplit "(?m)^---(?:[[:space:]]+#.*)?[[:space:]]*$" $manifest -1 -}}
{{- $documents := list -}}
{{- range $part := $parts -}}
  {{- $document := fromYaml $part -}}
  {{- if and (kindIs "map" $document) (hasKey $document "kind") -}}
    {{- $documents = append $documents $document -}}
  {{- else if and (eq $mode "document") (kindIs "map" $document) (not (hasKey $document "Error")) -}}
    {{- $documents = append $documents $document -}}
  {{- end -}}
{{- end -}}

{{- if eq $mode "document" -}}
  {{- if ne (len $documents) 1 -}}
    {{- fail (printf "document mode expected exactly one YAML document, got %d" (len $documents)) -}}
  {{- end -}}
  {{- printf "#INSPECT\tJSON\t%s\n" (toJson (index $documents 0)) -}}
{{- else -}}
  {{- $servicePorts := dict -}}
  {{- range $document := $documents -}}
    {{- if eq (get $document "kind") "Service" -}}
      {{- $namespace := dig "metadata" "namespace" "" $document -}}
      {{- $name := dig "metadata" "name" "" $document -}}
      {{- range $port := dig "spec" "ports" (list) $document -}}
        {{- if hasKey $port "name" -}}
          {{- $_ := set $servicePorts (printf "%s\t%s\t%s" $namespace $name (get $port "name")) (get $port "port") -}}
        {{- end -}}
      {{- end -}}
    {{- end -}}
  {{- end -}}

  {{- range $document := $documents -}}
    {{- $apiVersion := get $document "apiVersion" | default "" -}}
    {{- $kind := get $document "kind" | default "" -}}
    {{- $namespace := dig "metadata" "namespace" "" $document -}}
    {{- $name := dig "metadata" "name" "" $document -}}
    {{- printf "#INSPECT\tDOC\t%s\t%s\t%s\t%s\n" $apiVersion $kind $namespace $name -}}

    {{- if eq $kind "ListenerSet" -}}
      {{- $parent := dig "spec" "parentRef" (dict) $document -}}
      {{- printf "#INSPECT\tLISTENER_PARENT\t%s\t%s\t%s\t%s\t%s\n" $name (get $parent "group" | default "") (get $parent "kind" | default "") (get $parent "name" | default "") (get $parent "namespace" | default "") -}}
      {{- range $listener := dig "spec" "listeners" (list) $document -}}
        {{- $certificateRefs := dig "tls" "certificateRefs" (list) $listener -}}
        {{- $secretName := "" -}}
        {{- if gt (len $certificateRefs) 0 -}}
          {{- $secretName = get (index $certificateRefs 0) "name" | default "" -}}
        {{- end -}}
        {{- printf "#INSPECT\tLISTENER\t%s\t%s\t%s\t%v\t%s\t%s\n" $name (get $listener "name" | default "") (get $listener "hostname" | default "") (get $listener "port" | default "") (get $listener "protocol" | default "") $secretName -}}
      {{- end -}}
    {{- end -}}

    {{- if eq $kind "HTTPRoute" -}}
      {{- $rules := dig "spec" "rules" (list) $document -}}
      {{- printf "#INSPECT\tROUTE_META\t%s\t%s\t%d\n" $name $namespace (len $rules) -}}
      {{- $targetsListenerSet := false -}}
      {{- range $parent := dig "spec" "parentRefs" (list) $document -}}
        {{- if eq (get $parent "name" | default "") $targetListenerSet -}}
          {{- $targetsListenerSet = true -}}
        {{- end -}}
        {{- printf "#INSPECT\tROUTE_PARENT\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n" $name $namespace (get $parent "group" | default "") (get $parent "kind" | default "") (get $parent "name" | default "") (get $parent "namespace" | default "") (get $parent "sectionName" | default "") -}}
      {{- end -}}
      {{- range $hostname := dig "spec" "hostnames" (list) $document -}}
        {{- printf "#INSPECT\tROUTE_HOST\t%s\t%s\n" $name $hostname -}}
      {{- end -}}
      {{- if $targetsListenerSet -}}
        {{- range $hostname := dig "spec" "hostnames" (list) $document -}}
          {{- range $rule := $rules -}}
            {{- $matches := get $rule "matches" | default (list (dict)) -}}
            {{- range $match := $matches -}}
              {{- $path := dig "path" "value" "/" $match -}}
              {{- range $backend := get $rule "backendRefs" | default (list) -}}
                {{- $backendGroup := get $backend "group" | default "" -}}
                {{- $backendKind := get $backend "kind" | default "Service" -}}
                {{- if and (eq $backendGroup "") (eq $backendKind "Service") -}}
                  {{- printf "#INSPECT\tROUTE_BACKEND\t%s\t%s\t%s\t%s\t%v\n" $name $hostname $path (get $backend "name" | default "") (get $backend "port" | default "") -}}
                {{- end -}}
              {{- end -}}
            {{- end -}}
          {{- end -}}
        {{- end -}}
      {{- end -}}
    {{- end -}}

    {{- if eq $kind "Ingress" -}}
      {{- range $rule := dig "spec" "rules" (list) $document -}}
        {{- $hostname := get $rule "host" | default "" -}}
        {{- range $path := dig "http" "paths" (list) $rule -}}
          {{- $serviceName := dig "backend" "service" "name" "" $path -}}
          {{- $portReference := dig "backend" "service" "port" (dict) $path -}}
          {{- $port := get $portReference "number" | default "" -}}
          {{- if and (empty $port) (hasKey $portReference "name") -}}
            {{- $port = get $servicePorts (printf "%s\t%s\t%s" $namespace $serviceName (get $portReference "name")) | default (get $portReference "name") -}}
          {{- end -}}
          {{- printf "#INSPECT\tINGRESS_BACKEND\t%s\t%s\t%s\t%v\n" $hostname (get $path "path" | default "/") $serviceName $port -}}
        {{- end -}}
      {{- end -}}
    {{- end -}}

    {{- if eq $kind "ReferenceGrant" -}}
      {{- range $source := dig "spec" "from" (list) $document -}}
        {{- printf "#INSPECT\tGRANT_FROM\t%s\t%s\t%s\t%s\n" $name (get $source "group" | default "") (get $source "kind" | default "") (get $source "namespace" | default "") -}}
      {{- end -}}
      {{- range $target := dig "spec" "to" (list) $document -}}
        {{- printf "#INSPECT\tGRANT_TO\t%s\t%s\t%s\t%s\n" $name (get $target "group" | default "") (get $target "kind" | default "") (get $target "name" | default "") -}}
      {{- end -}}
    {{- end -}}

    {{- if eq $kind "CiliumNetworkPolicy" -}}
      {{- $sourceLabels := dict -}}
      {{- $ingressRules := dig "spec" "ingress" (list) $document -}}
      {{- if gt (len $ingressRules) 0 -}}
        {{- $fromEndpoints := get (index $ingressRules 0) "fromEndpoints" | default (list) -}}
        {{- if gt (len $fromEndpoints) 0 -}}
          {{- $sourceLabels = get (index $fromEndpoints 0) "matchLabels" | default (dict) -}}
        {{- end -}}
      {{- end -}}
      {{- printf "#INSPECT\tCILIUM\t%s\t%s\t%v\t%s\n" $name (toJson (dig "spec" "endpointSelector" (dict) $document)) (dig "spec" "enableDefaultDeny" "ingress" "" $document) (toJson $sourceLabels) -}}
    {{- end -}}
  {{- end -}}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: manifest-inspector
data:
  status: inspected
