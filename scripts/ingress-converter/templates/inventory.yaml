{{- $manifest := required "sourceManifest must be supplied with --set-file" .Values.sourceManifest -}}
{{- $sourceReleaseName := required "sourceReleaseName is required" .Values.sourceReleaseName -}}
{{- $sourceNamespace := required "sourceNamespace is required" .Values.sourceNamespace -}}
{{- $sourceKubeVersion := required "sourceKubeVersion is required" .Values.sourceKubeVersion -}}
{{- $sourceHelmVersion := required "sourceHelmVersion is required" .Values.sourceHelmVersion -}}
{{- $sourceApiVersions := .Values.sourceApiVersions | default (list) -}}
{{- $regexPrecedenceAcknowledged := .Values.allowImplementationSpecificRegexOrdering -}}
{{- if not (kindIs "string" $sourceKubeVersion) -}}
  {{- fail "sourceKubeVersion must be a non-empty string" -}}
{{- end -}}
{{- if not (kindIs "string" $sourceHelmVersion) -}}
  {{- fail "sourceHelmVersion must be a non-empty string" -}}
{{- end -}}
{{- if not (kindIs "bool" $regexPrecedenceAcknowledged) -}}
  {{- fail "allowImplementationSpecificRegexOrdering must be a boolean" -}}
{{- end -}}
{{- if not (kindIs "slice" $sourceApiVersions) -}}
  {{- fail "sourceApiVersions must be an array" -}}
{{- end -}}
{{- $sourceApiVersionSet := dict -}}
{{- range $apiVersionIndex, $apiVersion := $sourceApiVersions -}}
  {{- if or (not (kindIs "string" $apiVersion)) (empty $apiVersion) -}}
    {{- fail (printf "sourceApiVersions[%d] must be a non-empty string" $apiVersionIndex) -}}
  {{- end -}}
  {{- if hasKey $sourceApiVersionSet $apiVersion -}}
    {{- fail (printf "sourceApiVersions contains duplicate %q" $apiVersion) -}}
  {{- end -}}
  {{- $_ := set $sourceApiVersionSet $apiVersion true -}}
{{- end -}}
{{- $dnsSubdomainPattern := "^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*$" -}}
{{- $namespacePattern := "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" -}}
{{- if or (gt (len $sourceNamespace) 63) (not (regexMatch $namespacePattern $sourceNamespace)) -}}
  {{- fail (printf "sourceNamespace %q is not a valid Kubernetes namespace" $sourceNamespace) -}}
{{- end -}}
{{- $parts := regexSplit "(?m)^---(?:[[:space:]]+#.*)?[[:space:]]*$" $manifest -1 -}}
{{- $documents := list -}}
{{- range $partIndex, $part := $parts -}}
  {{- $topLevelApiVersions := regexFindAll "(?m)^apiVersion:[[:space:]]" $part -1 -}}
  {{- if gt (len $topLevelApiVersions) 1 -}}
    {{- fail (printf "rendered manifest document %d contains multiple top-level apiVersion fields; a YAML separator is missing" $partIndex) -}}
  {{- end -}}
  {{- $document := fromYaml $part -}}
  {{- if and (kindIs "map" $document) (hasKey $document "Error") -}}
    {{- fail (printf "rendered manifest document %d is invalid YAML: %s" $partIndex (get $document "Error")) -}}
  {{- end -}}
  {{- if and (kindIs "map" $document) (hasKey $document "kind") -}}
    {{- $documents = append $documents $document -}}
  {{- end -}}
{{- end -}}

{{- $services := dict -}}
{{- $ingresses := dict -}}
{{- range $documentIndex, $document := $documents -}}
  {{- $apiVersion := get $document "apiVersion" | default "" -}}
  {{- $kind := get $document "kind" | default "" -}}
  {{- if or
        (hasPrefix "gateway.networking.k8s.io/" $apiVersion)
        (hasPrefix "gateway.networking.x-k8s.io/" $apiVersion)
        (hasPrefix "gateway.envoyproxy.io/" $apiVersion) -}}
    {{- fail (printf "source render unexpectedly contains %s resource %s %q; Harness native Gateway API and Envoy Gateway output must be disabled" $apiVersion $kind (dig "metadata" "name" "" $document)) -}}
  {{- end -}}

  {{- if eq $kind "Service" -}}
    {{- $documentNamespace := dig "metadata" "namespace" "" $document | default $sourceNamespace -}}
    {{- if eq $documentNamespace $sourceNamespace -}}
      {{- $serviceName := dig "metadata" "name" "" $document -}}
      {{- if or (empty $serviceName) (gt (len $serviceName) 253) (not (regexMatch $dnsSubdomainPattern $serviceName)) -}}
        {{- fail (printf "Service document %d has an invalid metadata.name %q" $documentIndex $serviceName) -}}
      {{- end -}}
      {{- $serviceKey := printf "%s/%s" $documentNamespace $serviceName -}}
      {{- if hasKey $services $serviceKey -}}
        {{- fail (printf "source render contains duplicate Service %s" $serviceKey) -}}
      {{- end -}}
      {{- $portsByName := dict -}}
      {{- $portsByNumber := dict -}}
      {{- range $portIndex, $servicePort := dig "spec" "ports" (list) $document -}}
        {{- $portNumber := get $servicePort "port" -}}
        {{- if not (regexMatch "^[0-9]+$" (toString $portNumber)) -}}
          {{- fail (printf "Service %s spec.ports[%d].port must be an integer" $serviceKey $portIndex) -}}
        {{- end -}}
        {{- $portNumber = atoi (toString $portNumber) -}}
        {{- if or (lt $portNumber 1) (gt $portNumber 65535) -}}
          {{- fail (printf "Service %s spec.ports[%d].port must be between 1 and 65535" $serviceKey $portIndex) -}}
        {{- end -}}
        {{- $portName := get $servicePort "name" | default "" -}}
        {{- if $portName -}}
          {{- if hasKey $portsByName $portName -}}
            {{- fail (printf "Service %s contains duplicate port name %q" $serviceKey $portName) -}}
          {{- end -}}
          {{- $_ := set $portsByName $portName $portNumber -}}
        {{- end -}}
        {{- $_ := set $portsByNumber (toString $portNumber) true -}}
      {{- end -}}
      {{- $_ := set $services $serviceKey (dict "portsByName" $portsByName "portsByNumber" $portsByNumber) -}}
    {{- end -}}
  {{- end -}}

  {{- if eq $kind "Ingress" -}}
    {{- if ne $apiVersion "networking.k8s.io/v1" -}}
      {{- fail (printf "Ingress %q uses unsupported apiVersion %q" (dig "metadata" "name" "" $document) $apiVersion) -}}
    {{- end -}}
    {{- $documentNamespace := dig "metadata" "namespace" "" $document | default $sourceNamespace -}}
    {{- if ne $documentNamespace $sourceNamespace -}}
      {{- fail (printf "Ingress %q is in namespace %q; all converted Ingresses must be in %q" (dig "metadata" "name" "" $document) $documentNamespace $sourceNamespace) -}}
    {{- end -}}
    {{- $ingressName := dig "metadata" "name" "" $document -}}
    {{- if or (empty $ingressName) (gt (len $ingressName) 253) (not (regexMatch $dnsSubdomainPattern $ingressName)) -}}
      {{- fail (printf "Ingress document %d has an invalid metadata.name %q" $documentIndex $ingressName) -}}
    {{- end -}}
    {{- if hasKey $ingresses $ingressName -}}
      {{- fail (printf "source render contains duplicate Ingress %s/%s" $sourceNamespace $ingressName) -}}
    {{- end -}}
    {{- $_ := set $ingresses $ingressName $document -}}
  {{- end -}}
{{- end -}}

{{- $supportedNginxAnnotations := list
      "nginx.ingress.kubernetes.io/proxy-read-timeout"
      "nginx.ingress.kubernetes.io/proxy-send-timeout"
      "nginx.ingress.kubernetes.io/rewrite-target"
      "nginx.ingress.kubernetes.io/use-regex" -}}
{{- $listenersByHost := dict -}}
{{- $listenerHostsByName := dict -}}
{{- $tlsSecretsByName := dict -}}
{{- $routes := list -}}
{{- $routeNames := dict -}}
{{- $filtersByName := dict -}}
{{- $backendTrafficPolicies := list -}}
{{- $backendTrafficPolicyNames := dict -}}
{{- $matchContractsByKey := dict -}}
{{- $regexHosts := dict -}}
{{- $regexHostCounts := dict -}}
{{- $plainHosts := dict -}}
{{- $warnings := list -}}
{{- $expectedIngressClass := "" -}}

{{- range $ingressName, $ingress := $ingresses -}}
  {{- $annotations := dig "metadata" "annotations" (dict) $ingress | default (dict) -}}
  {{- if not (kindIs "map" $annotations) -}}
    {{- fail (printf "Ingress %s metadata.annotations must be a mapping" $ingressName) -}}
  {{- end -}}
  {{- range $annotationName, $_ := $annotations -}}
    {{- if and (hasPrefix "nginx.ingress.kubernetes.io/" $annotationName) (not (has $annotationName $supportedNginxAnnotations)) -}}
      {{- fail (printf "Ingress %s uses unsupported NGINX annotation %s" $ingressName $annotationName) -}}
    {{- end -}}
  {{- end -}}

  {{- $specIngressClass := dig "spec" "ingressClassName" "" $ingress -}}
  {{- if and (not (empty $specIngressClass)) (not (kindIs "string" $specIngressClass)) -}}
    {{- fail (printf "Ingress %s spec.ingressClassName must be a string" $ingressName) -}}
  {{- end -}}
  {{- $legacyIngressClass := "" -}}
  {{- if hasKey $annotations "kubernetes.io/ingress.class" -}}
    {{- $legacyIngressClassValue := get $annotations "kubernetes.io/ingress.class" -}}
    {{- if not (kindIs "string" $legacyIngressClassValue) -}}
      {{- fail (printf "Ingress %s kubernetes.io/ingress.class annotation must be a string" $ingressName) -}}
    {{- end -}}
    {{- $legacyIngressClass = $legacyIngressClassValue -}}
  {{- end -}}
  {{- if and $specIngressClass $legacyIngressClass (ne $specIngressClass $legacyIngressClass) -}}
    {{- fail (printf "Ingress %s has conflicting spec and annotation Ingress classes" $ingressName) -}}
  {{- end -}}
  {{- $effectiveIngressClass := $specIngressClass | default $legacyIngressClass -}}
  {{- if empty $effectiveIngressClass -}}
    {{- $warnings = append $warnings (printf "Ingress %s has no explicit Ingress class; conversion assumes the environment's default controller" $ingressName) -}}
  {{- else -}}
    {{- if or (gt (len $effectiveIngressClass) 253) (not (regexMatch $dnsSubdomainPattern $effectiveIngressClass)) -}}
      {{- fail (printf "Ingress %s has invalid Ingress class %q" $ingressName $effectiveIngressClass) -}}
    {{- end -}}
    {{- if empty $expectedIngressClass -}}
      {{- $expectedIngressClass = $effectiveIngressClass -}}
    {{- else if ne $expectedIngressClass $effectiveIngressClass -}}
      {{- fail (printf "rendered Ingresses use multiple Ingress classes: %q and %q" $expectedIngressClass $effectiveIngressClass) -}}
    {{- end -}}
  {{- end -}}

  {{- $useRegex := false -}}
  {{- if hasKey $annotations "nginx.ingress.kubernetes.io/use-regex" -}}
    {{- $useRegexValue := lower (toString (get $annotations "nginx.ingress.kubernetes.io/use-regex")) -}}
    {{- if eq $useRegexValue "true" -}}
      {{- $useRegex = true -}}
    {{- else if ne $useRegexValue "false" -}}
      {{- fail (printf "Ingress %s has invalid nginx.ingress.kubernetes.io/use-regex value %q" $ingressName $useRegexValue) -}}
    {{- end -}}
  {{- end -}}

  {{- $rewriteTarget := "" -}}
  {{- if hasKey $annotations "nginx.ingress.kubernetes.io/rewrite-target" -}}
    {{- $rewriteTarget = toString (get $annotations "nginx.ingress.kubernetes.io/rewrite-target") -}}
    {{- if empty $rewriteTarget -}}
      {{- fail (printf "Ingress %s has an empty rewrite-target annotation" $ingressName) -}}
    {{- end -}}
    {{- if not (hasPrefix "/" $rewriteTarget) -}}
      {{- fail (printf "Ingress %s rewrite-target must be an absolute path" $ingressName) -}}
    {{- end -}}
    {{- if regexMatch "\\$[1-9][0-9]+" $rewriteTarget -}}
      {{- fail (printf "Ingress %s rewrite-target uses a capture above $9, which Envoy substitution does not support" $ingressName) -}}
    {{- end -}}
    {{- $rewriteWithoutCaptures := regexReplaceAll "\\$[1-9]" $rewriteTarget "" -}}
    {{- if contains "$" $rewriteWithoutCaptures -}}
      {{- fail (printf "Ingress %s rewrite-target contains an unsupported variable reference" $ingressName) -}}
    {{- end -}}
    {{- if not $useRegex -}}
      {{- $warnings = append $warnings (printf "Ingress %s rewrite-target requires regex conversion although use-regex is not set" $ingressName) -}}
    {{- end -}}
  {{- end -}}

  {{- $readTimeoutSeconds := -1 -}}
  {{- if hasKey $annotations "nginx.ingress.kubernetes.io/proxy-read-timeout" -}}
    {{- $readTimeoutValue := toString (get $annotations "nginx.ingress.kubernetes.io/proxy-read-timeout") -}}
    {{- if not (regexMatch "^[0-9]{1,5}$" $readTimeoutValue) -}}
      {{- fail (printf "Ingress %s proxy-read-timeout must contain 1 to 5 decimal seconds" $ingressName) -}}
    {{- end -}}
    {{- $readTimeoutSeconds = atoi $readTimeoutValue -}}
    {{- $warnings = append $warnings (printf "Ingress %s proxy-read-timeout is mapped to Envoy streamIdleTimeout; the inactivity semantics are the closest available equivalent" $ingressName) -}}
  {{- end -}}
  {{- $sendTimeoutSeconds := -1 -}}
  {{- if hasKey $annotations "nginx.ingress.kubernetes.io/proxy-send-timeout" -}}
    {{- $sendTimeoutValue := toString (get $annotations "nginx.ingress.kubernetes.io/proxy-send-timeout") -}}
    {{- if not (regexMatch "^[0-9]{1,5}$" $sendTimeoutValue) -}}
      {{- fail (printf "Ingress %s proxy-send-timeout must contain 1 to 5 decimal seconds" $ingressName) -}}
    {{- end -}}
    {{- $sendTimeoutSeconds = atoi $sendTimeoutValue -}}
    {{- $warnings = append $warnings (printf "Ingress %s proxy-send-timeout is mapped to Envoy streamIdleTimeout; the inactivity semantics are the closest available equivalent" $ingressName) -}}
  {{- end -}}
  {{- $idleTimeoutSeconds := -1 -}}
  {{- if ge $readTimeoutSeconds 0 -}}
    {{- $idleTimeoutSeconds = $readTimeoutSeconds -}}
  {{- end -}}
  {{- if and (ge $sendTimeoutSeconds 0) (or (lt $idleTimeoutSeconds 0) (lt $sendTimeoutSeconds $idleTimeoutSeconds)) -}}
    {{- $idleTimeoutSeconds = $sendTimeoutSeconds -}}
  {{- end -}}
  {{- if and (ge $readTimeoutSeconds 0) (ge $sendTimeoutSeconds 0) (ne $readTimeoutSeconds $sendTimeoutSeconds) -}}
    {{- $warnings = append $warnings (printf "Ingress %s has different read and send inactivity timeouts; Envoy streamIdleTimeout uses the stricter %ds value" $ingressName $idleTimeoutSeconds) -}}
  {{- end -}}
  {{- $timeouts := dict -}}
  {{- if ge $idleTimeoutSeconds 0 -}}
    {{- /* Disable total request deadlines; the generated Envoy policy supplies an inactivity timeout. */ -}}
    {{- $_ := set $timeouts "request" "0s" -}}
    {{- $_ := set $timeouts "backendRequest" "0s" -}}
  {{- end -}}

  {{- $spec := get $ingress "spec" | default (dict) -}}
  {{- if not (kindIs "map" $spec) -}}
    {{- fail (printf "Ingress %s spec must be a mapping" $ingressName) -}}
  {{- end -}}
  {{- if and (hasKey $spec "defaultBackend") (not (empty (get $spec "defaultBackend"))) -}}
    {{- fail (printf "Ingress %s uses spec.defaultBackend, which is not supported" $ingressName) -}}
  {{- end -}}

  {{- $tlsByHost := dict -}}
  {{- range $tlsIndex, $tls := get $spec "tls" | default (list) -}}
    {{- $secretName := get $tls "secretName" | default "" -}}
    {{- if or (not (kindIs "string" $secretName)) (empty $secretName) (gt (len $secretName) 253) (not (regexMatch $dnsSubdomainPattern $secretName)) -}}
      {{- fail (printf "Ingress %s spec.tls[%d].secretName is invalid" $ingressName $tlsIndex) -}}
    {{- end -}}
    {{- $tlsHosts := get $tls "hosts" | default (list) -}}
    {{- if or (not (kindIs "slice" $tlsHosts)) (eq (len $tlsHosts) 0) -}}
      {{- fail (printf "Ingress %s spec.tls[%d].hosts must be a non-empty list" $ingressName $tlsIndex) -}}
    {{- end -}}
    {{- range $tlsHost := $tlsHosts -}}
      {{- if or (not (kindIs "string" $tlsHost)) (empty $tlsHost) (gt (len $tlsHost) 253) (contains "*" $tlsHost) (not (regexMatch $dnsSubdomainPattern $tlsHost)) -}}
        {{- fail (printf "Ingress %s TLS hosts must contain concrete FQDNs" $ingressName) -}}
      {{- end -}}
      {{- if and (hasKey $tlsByHost $tlsHost) (ne (get $tlsByHost $tlsHost) $secretName) -}}
        {{- fail (printf "Ingress %s maps hostname %q to conflicting TLS Secrets" $ingressName $tlsHost) -}}
      {{- end -}}
      {{- $_ := set $tlsByHost $tlsHost $secretName -}}
    {{- end -}}
  {{- end -}}

  {{- $ingressRules := get $spec "rules" | default (list) -}}
  {{- if or (not (kindIs "slice" $ingressRules)) (eq (len $ingressRules) 0) -}}
    {{- fail (printf "Ingress %s spec.rules must be a non-empty list" $ingressName) -}}
  {{- end -}}
  {{- $rulesByHost := dict -}}
  {{- $warnedImplementationSpecific := false -}}
  {{- range $ingressRuleIndex, $ingressRule := $ingressRules -}}
    {{- $hostname := get $ingressRule "host" | default "" -}}
    {{- if or (not (kindIs "string" $hostname)) (empty $hostname) (gt (len $hostname) 253) (contains "*" $hostname) (not (regexMatch $dnsSubdomainPattern $hostname)) -}}
      {{- fail (printf "Ingress %s spec.rules[%d].host must be a concrete FQDN" $ingressName $ingressRuleIndex) -}}
    {{- end -}}
    {{- if not (hasKey $tlsByHost $hostname) -}}
      {{- fail (printf "Ingress %s hostname %q has no matching TLS Secret" $ingressName $hostname) -}}
    {{- end -}}
    {{- $tlsSecret := get $tlsByHost $hostname -}}
    {{- $listenerName := printf "https-%s" (sha256sum $hostname | trunc 12) -}}
    {{- if and (hasKey $listenerHostsByName $listenerName) (ne (get $listenerHostsByName $listenerName) $hostname) -}}
      {{- fail (printf "generated ListenerSet section name collision for %q" $listenerName) -}}
    {{- end -}}
    {{- $_ := set $listenerHostsByName $listenerName $hostname -}}
    {{- if hasKey $listenersByHost $hostname -}}
      {{- $existingListener := get $listenersByHost $hostname -}}
      {{- if ne (get $existingListener "tlsSecret") $tlsSecret -}}
        {{- fail (printf "hostname %q is mapped to conflicting TLS Secrets across Ingresses" $hostname) -}}
      {{- end -}}
    {{- else -}}
      {{- $_ := set $listenersByHost $hostname (dict "name" $listenerName "hostname" $hostname "tlsSecret" $tlsSecret) -}}
    {{- end -}}
    {{- $_ := set $tlsSecretsByName $tlsSecret true -}}

    {{- $http := get $ingressRule "http" | default (dict) -}}
    {{- $paths := get $http "paths" | default (list) -}}
    {{- if or (not (kindIs "slice" $paths)) (eq (len $paths) 0) -}}
      {{- fail (printf "Ingress %s spec.rules[%d].http.paths must be a non-empty list" $ingressName $ingressRuleIndex) -}}
    {{- end -}}
    {{- $hostRules := get $rulesByHost $hostname | default (list) -}}
    {{- range $pathIndex, $path := $paths -}}
      {{- $pathValue := get $path "path" | default "/" -}}
      {{- if or (not (kindIs "string" $pathValue)) (empty $pathValue) -}}
        {{- fail (printf "Ingress %s path %d for hostname %q must be a non-empty string" $ingressName $pathIndex $hostname) -}}
      {{- end -}}
      {{- $sourcePathType := get $path "pathType" | default "ImplementationSpecific" -}}
      {{- $gatewayPathType := "" -}}
      {{- $gatewayPathValue := $pathValue -}}
      {{- $pathUsesRegex := or $useRegex (not (empty $rewriteTarget)) -}}
      {{- if $pathUsesRegex -}}
        {{- if eq $sourcePathType "Exact" -}}
          {{- fail (printf "Ingress %s combines pathType Exact with use-regex=true" $ingressName) -}}
        {{- end -}}
        {{- if not (hasPrefix "(?i)" $gatewayPathValue) -}}
          {{- $gatewayPathValue = printf "(?i)%s" $gatewayPathValue -}}
        {{- end -}}
        {{- if gt (len $gatewayPathValue) 1024 -}}
          {{- fail (printf "Ingress %s regex path %q exceeds the Gateway API length limit" $ingressName $pathValue) -}}
        {{- end -}}
        {{- $_ := mustRegexMatch $gatewayPathValue "" -}}
        {{- $gatewayPathType = "RegularExpression" -}}
        {{- $_ := set $regexHosts $hostname true -}}
        {{- $regexHostCount := get $regexHostCounts $hostname | default 0 -}}
        {{- $_ := set $regexHostCounts $hostname (add $regexHostCount 1) -}}
      {{- else if eq $sourcePathType "Exact" -}}
        {{- if not (hasPrefix "/" $pathValue) -}}
          {{- fail (printf "Ingress %s Exact path %q must start with /" $ingressName $pathValue) -}}
        {{- end -}}
        {{- $gatewayPathType = "Exact" -}}
      {{- else if or (eq $sourcePathType "Prefix") (eq $sourcePathType "ImplementationSpecific") -}}
        {{- if not (hasPrefix "/" $pathValue) -}}
          {{- fail (printf "Ingress %s prefix path %q must start with /" $ingressName $pathValue) -}}
        {{- end -}}
        {{- $gatewayPathType = "PathPrefix" -}}
        {{- if and (eq $sourcePathType "ImplementationSpecific") (not $warnedImplementationSpecific) -}}
          {{- $warnings = append $warnings (printf "Ingress %s ImplementationSpecific paths are mapped to PathPrefix for Gateway API" $ingressName) -}}
          {{- $warnedImplementationSpecific = true -}}
        {{- end -}}
      {{- else -}}
        {{- fail (printf "Ingress %s uses unsupported pathType %q" $ingressName $sourcePathType) -}}
      {{- end -}}
      {{- if not $pathUsesRegex -}}
        {{- $_ := set $plainHosts $hostname true -}}
      {{- end -}}

      {{- $serviceRef := dig "backend" "service" (dict) $path -}}
      {{- if not (kindIs "map" $serviceRef) -}}
        {{- fail (printf "Ingress %s path %q must use a Service backend" $ingressName $pathValue) -}}
      {{- end -}}
      {{- $backendName := get $serviceRef "name" | default "" -}}
      {{- if or (not (kindIs "string" $backendName)) (empty $backendName) (gt (len $backendName) 253) (not (regexMatch $dnsSubdomainPattern $backendName)) -}}
        {{- fail (printf "Ingress %s path %q has an invalid backend Service name" $ingressName $pathValue) -}}
      {{- end -}}
      {{- $portRef := get $serviceRef "port" | default (dict) -}}
      {{- if not (kindIs "map" $portRef) -}}
        {{- fail (printf "Ingress %s path %q has an invalid backend Service port" $ingressName $pathValue) -}}
      {{- end -}}
      {{- $hasPortNumber := hasKey $portRef "number" -}}
      {{- $hasPortName := hasKey $portRef "name" -}}
      {{- if eq $hasPortNumber $hasPortName -}}
        {{- fail (printf "Ingress %s path %q backend port must contain exactly one of number or name" $ingressName $pathValue) -}}
      {{- end -}}
      {{- $serviceKey := printf "%s/%s" $sourceNamespace $backendName -}}
      {{- if not (hasKey $services $serviceKey) -}}
        {{- fail (printf "Ingress %s path %q references missing Service %s" $ingressName $pathValue $serviceKey) -}}
      {{- end -}}
      {{- $serviceData := get $services $serviceKey -}}
      {{- $backendPort := 0 -}}
      {{- if $hasPortNumber -}}
        {{- $backendPortValue := toString (get $portRef "number") -}}
        {{- if not (regexMatch "^[0-9]+$" $backendPortValue) -}}
          {{- fail (printf "Ingress %s path %q backend port number must be an integer" $ingressName $pathValue) -}}
        {{- end -}}
        {{- $backendPort = atoi $backendPortValue -}}
        {{- $portsByNumber := get $serviceData "portsByNumber" -}}
        {{- if not (hasKey $portsByNumber (toString $backendPort)) -}}
          {{- $warnings = append $warnings (printf "Ingress %s path %q references numeric port %d not exposed by rendered Service %s; preserving the Ingress contract" $ingressName $pathValue $backendPort $serviceKey) -}}
        {{- end -}}
      {{- else -}}
        {{- $backendPortName := toString (get $portRef "name") -}}
        {{- if or (empty $backendPortName) (gt (len $backendPortName) 15) (not (regexMatch $namespacePattern $backendPortName)) -}}
          {{- fail (printf "Ingress %s path %q references invalid Service port name %q" $ingressName $pathValue $backendPortName) -}}
        {{- end -}}
        {{- $portsByName := get $serviceData "portsByName" -}}
        {{- if not (hasKey $portsByName $backendPortName) -}}
          {{- fail (printf "Ingress %s path %q references unknown port %q on Service %s" $ingressName $pathValue $backendPortName $serviceKey) -}}
        {{- end -}}
        {{- $backendPort = get $portsByName $backendPortName -}}
      {{- end -}}
      {{- if or (lt $backendPort 1) (gt $backendPort 65535) -}}
        {{- fail (printf "Ingress %s path %q backend port must be between 1 and 65535" $ingressName $pathValue) -}}
      {{- end -}}

      {{- $matchKey := printf "%s\n%s\n%s" $hostname $gatewayPathType $gatewayPathValue -}}
      {{- $matchContract := dict
            "backend" (dict "name" $backendName "port" $backendPort)
            "rewriteTarget" $rewriteTarget
            "timeouts" $timeouts
            "streamIdleTimeout" (ternary (printf "%ds" $idleTimeoutSeconds) "" (ge $idleTimeoutSeconds 0)) -}}
      {{- $emitRule := true -}}
      {{- if hasKey $matchContractsByKey $matchKey -}}
        {{- if ne (mustToJson (get $matchContractsByKey $matchKey)) (mustToJson $matchContract) -}}
          {{- fail (printf "hostname %q has an ambiguous duplicate %s match %q" $hostname $gatewayPathType $gatewayPathValue) -}}
        {{- end -}}
        {{- $emitRule = false -}}
      {{- else -}}
        {{- $_ := set $matchContractsByKey $matchKey $matchContract -}}
      {{- end -}}

      {{- if $emitRule -}}
        {{- $convertedRule := dict
              "path" (dict "type" $gatewayPathType "value" $gatewayPathValue)
              "backend" (dict "name" $backendName "port" $backendPort) -}}
        {{- if $timeouts -}}
          {{- $_ := set $convertedRule "timeouts" $timeouts -}}
        {{- end -}}
        {{- if $rewriteTarget -}}
          {{- $filterHashInput := printf "%s\n%s\n%s\n%s\n%s\n%d" $ingressName $hostname $gatewayPathValue $rewriteTarget $backendName $backendPort -}}
          {{- $filterSuffix := printf "-rw-%s" (sha256sum $filterHashInput | trunc 10) -}}
          {{- $filterBaseLength := int (sub 63 (len $filterSuffix)) -}}
          {{- $filterBase := $ingressName | trunc $filterBaseLength | trimSuffix "-" | trimSuffix "." -}}
          {{- $filterName := printf "%s%s" $filterBase $filterSuffix -}}
          {{- $substitution := regexReplaceAll "\\$" $rewriteTarget "\\" -}}
          {{- $filter := dict "name" $filterName "pattern" $gatewayPathValue "substitution" $substitution -}}
          {{- if hasKey $filtersByName $filterName -}}
            {{- if ne (mustToJson (get $filtersByName $filterName)) (mustToJson $filter) -}}
              {{- fail (printf "generated HTTPRouteFilter name collision for %q" $filterName) -}}
            {{- end -}}
          {{- else -}}
            {{- $_ := set $filtersByName $filterName $filter -}}
          {{- end -}}
          {{- $_ := set $convertedRule "filters" (list (dict
                "type" "ExtensionRef"
                "extensionRef" (dict
                  "group" "gateway.envoyproxy.io"
                  "kind" "HTTPRouteFilter"
                  "name" $filterName))) -}}
        {{- end -}}
        {{- $hostRules = append $hostRules $convertedRule -}}
      {{- end -}}
    {{- end -}}
    {{- $_ := set $rulesByHost $hostname $hostRules -}}
  {{- end -}}

  {{- range $hostname, $hostRules := $rulesByHost -}}
    {{- $listener := get $listenersByHost $hostname -}}
    {{- $chunkCount := int (div (add (len $hostRules) 15) 16) -}}
    {{- range $chunkIndex := until $chunkCount -}}
      {{- $start := int (mul $chunkIndex 16) -}}
      {{- $end := int (min (add $start 16) (len $hostRules)) -}}
      {{- $routeRules := slice $hostRules $start $end -}}
      {{- $routeSuffix := printf "-%s-p%d" (sha256sum $hostname | trunc 8) (add $chunkIndex 1) -}}
      {{- $routeBaseLength := int (sub 63 (len $routeSuffix)) -}}
      {{- $routeBase := $ingressName | trunc $routeBaseLength | trimSuffix "-" | trimSuffix "." -}}
      {{- $routeName := printf "%s%s" $routeBase $routeSuffix -}}
      {{- if hasKey $routeNames $routeName -}}
        {{- fail (printf "generated HTTPRoute name collision for %q" $routeName) -}}
      {{- end -}}
      {{- $_ := set $routeNames $routeName true -}}
      {{- $route := dict
            "name" $routeName
            "sourceIngress" $ingressName
            "hostname" $hostname
            "sectionName" (get $listener "name")
            "rules" $routeRules -}}
      {{- $routes = append $routes $route -}}
      {{- if ge $idleTimeoutSeconds 0 -}}
        {{- $policySuffix := printf "-idle-%s" (sha256sum $routeName | trunc 8) -}}
        {{- $policyBaseLength := int (sub 63 (len $policySuffix)) -}}
        {{- $policyBase := $routeName | trunc $policyBaseLength | trimSuffix "-" | trimSuffix "." -}}
        {{- $policyName := printf "%s%s" $policyBase $policySuffix -}}
        {{- if hasKey $backendTrafficPolicyNames $policyName -}}
          {{- fail (printf "generated BackendTrafficPolicy name collision for %q" $policyName) -}}
        {{- end -}}
        {{- $_ := set $backendTrafficPolicyNames $policyName true -}}
        {{- $backendTrafficPolicies = append $backendTrafficPolicies (dict
              "name" $policyName
              "sourceIngress" $ingressName
              "targetRoute" $routeName
              "streamIdleTimeout" (printf "%ds" $idleTimeoutSeconds)) -}}
      {{- end -}}
    {{- end -}}
  {{- end -}}
{{- end -}}

{{- range $hostname, $_ := $regexHosts -}}
  {{- $regexHostCount := get $regexHostCounts $hostname | default 0 -}}
  {{- if gt $regexHostCount 1 -}}
    {{- if not $regexPrecedenceAcknowledged -}}
      {{- fail (printf "hostname %s contains %d regular-expression matches whose ingress-nginx ordering cannot be preserved; rerun with --allow-implementation-specific-regex-ordering only after reviewing overlaps" $hostname $regexHostCount) -}}
    {{- end -}}
    {{- $warnings = append $warnings (printf "hostname %s contains %d regular-expression matches; review overlaps because Gateway API does not reproduce ingress-nginx length ordering" $hostname $regexHostCount) -}}
  {{- end -}}
  {{- if hasKey $plainHosts $hostname -}}
    {{- if not $regexPrecedenceAcknowledged -}}
      {{- fail (printf "hostname %s combines regular-expression and plain path matches whose ingress-nginx ordering cannot be preserved; rerun with --allow-implementation-specific-regex-ordering only after reviewing precedence" $hostname) -}}
    {{- end -}}
    {{- $warnings = append $warnings (printf "hostname %s combines NGINX regex and plain paths; Gateway API uses explicit match precedence instead of ingress-nginx host-wide regex ordering" $hostname) -}}
  {{- end -}}
{{- end -}}

{{- $listeners := list -}}
{{- range $hostname, $listener := $listenersByHost -}}
  {{- $listeners = append $listeners $listener -}}
{{- end -}}
{{- $httpRouteFilters := list -}}
{{- range $filterName, $filter := $filtersByName -}}
  {{- $httpRouteFilters = append $httpRouteFilters $filter -}}
{{- end -}}
{{- $tlsSecrets := list -}}
{{- range $secretName, $_ := $tlsSecretsByName -}}
  {{- $tlsSecrets = append $tlsSecrets $secretName -}}
{{- end -}}
{{- if gt (len $listeners) 64 -}}
  {{- fail "generated ListenerSet would exceed the Gateway API limit of 64 listeners" -}}
{{- end -}}
{{- if gt (len $tlsSecrets) 16 -}}
  {{- fail "generated ReferenceGrant would exceed the Gateway API limit of 16 targets" -}}
{{- end -}}
{{- $routingContract := dict
      "listeners" $listeners
      "routes" $routes
      "httpRouteFilters" $httpRouteFilters
      "backendTrafficPolicies" $backendTrafficPolicies
      "tlsSecrets" $tlsSecrets -}}
{{- $routingContractSha256 := sha256sum (mustToJson $routingContract) -}}
{{- $inventory := dict
      "schemaVersion" 2
      "source" (dict
        "releaseName" $sourceReleaseName
        "namespace" $sourceNamespace
        "ingressClassName" $expectedIngressClass
        "kubeVersion" $sourceKubeVersion
        "helmVersion" $sourceHelmVersion
        "apiVersions" $sourceApiVersions
        "regexPrecedenceAcknowledged" $regexPrecedenceAcknowledged
        "routingContractSha256" $routingContractSha256)
      "listeners" $listeners
      "routes" $routes
      "httpRouteFilters" $httpRouteFilters
      "backendTrafficPolicies" $backendTrafficPolicies
      "tlsSecrets" $tlsSecrets -}}
{{ printf "#HARNESS_GATEWAY_INVENTORY\t%s\n" (mustToJson $inventory) }}
{{- range $warning := $warnings }}
{{ printf "#HARNESS_GATEWAY_WARNING\t%s\n" $warning }}
{{- end }}
{{ printf "#HARNESS_GATEWAY_SUMMARY\t%d Ingresses, %d listeners, %d HTTPRoutes, %d rewrite filters, %d timeout policies\n" (len $ingresses) (len $listeners) (len $routes) (len $httpRouteFilters) (len $backendTrafficPolicies) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: harness-ingress-converter-result
  namespace: {{ .Release.Namespace }}
data:
  status: converted
