# Merge this block into values-base.yaml.
gatewayAPI:
  # Generated Gateway API templates remain inactive unless an environment
  # values file explicitly enables them.
  enabled: false
  environment: ""

  gateway:
    name: apps-gateway
    namespace: envoy-gateway-apps

  # The ListenerSet is kept with the shared Gateway. HTTPRoutes and TLS Secrets
  # remain in the Harness release namespace.
  listenerSet:
    name: harness
    namespace: envoy-gateway-apps

  # This grant is created in the Harness namespace and permits only the
  # generated ListenerSet to reference the discovered TLS Secrets.
  referenceGrant:
    name: harness-gateway-tls

  # Optional port 80 listeners and HTTP to HTTPS redirect routes.
  httpRedirect:
    enabled: false
    statusCode: 301
