gatewayTransition:
  # Disabled by default so the standalone chart can be inspected or linted safely.
  # Environment files enable it after discovered values have been generated.
  enabled: false

  # Shadow mode means that the existing Harness Ingress resources remain active.
  # This chart only creates additional Gateway API resources.
  mode: shadow

  gateway:
    name: apps-gateway
    namespace: envoy-gateway-apps

  listenerSet:
    name: harness
    namespace: envoy-gateway-apps
    port: 443

    # HTTPRoutes are created in the Harness namespace and attach across namespaces.
    # The parent Gateway must allow this ListenerSet through spec.allowedListeners.
    allowedRoutesNamespacesFrom: All

  referenceGrant:
    enabled: true

  commonLabels:
    app.kubernetes.io/part-of: harness
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: gateway-transition

  # This list is generated by render.sh. Do not maintain it manually.
  discoveredRoutes: []
