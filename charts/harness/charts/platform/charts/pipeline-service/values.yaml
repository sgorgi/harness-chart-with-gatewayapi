updateStrategy:
  rollingUpdate:
    maxSurge: 100%
    maxUnavailable: 0
  type: RollingUpdate
progressDeadlineSeconds: 600
allowedOrigins: ""
image:
  registry: docker.io
  digest: "sha256:9e5d811c57dd2747d5b79abb932eee46aa177e6460ad20b81eeee25e9320ca10"
  repository: harnesssecure/pipeline-service-signed
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "1.190.0"
  imagePullSecrets: []
mongoSecrets:
  userName:
    name: harness-secrets
    key: mongodbUsername
  password:
    name: mongodb-replicaset-chart
    key: mongodb-root-password
timescaleSecret:
  password:
    name: harness-secrets
    key: timescaledbPostgresPassword
java:
  memory: "4096m"
# Pipeline splitting configuration
# When enabled, creates separate orchestration-engine deployment for worker processing
pipelineSplitting:
  enabled: true
  pipelineService:
    workloadType: "GRAPH"
  orchestrationEngine:
    workloadType: "ORCHESTRATION_ENGINE"
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "harness-default"
podAnnotations: {}
podSecurityContext: {}
# fsGroup: 2000

securityContext:
  runAsUser: 65534
  runAsNonRoot: true
probes:
  livenessProbe:
    httpGet:
      path: /api/health/liveness
      port: http-pms
      scheme: HTTP
    timeoutSeconds: 10
    periodSeconds: 60
    successThreshold: 1
    failureThreshold: 5
  readinessProbe:
    httpGet:
      path: /api/health
      port: http-pms
      scheme: HTTP
    timeoutSeconds: 1
    periodSeconds: 5
    successThreshold: 1
    failureThreshold: 10
  startupProbe:
    httpGet:
      path: /api/health
      port: http-pms
      scheme: HTTP
    initialDelaySeconds: 60
    timeoutSeconds: 1
    periodSeconds: 5
    successThreshold: 1
    failureThreshold: 30
service:
  annotations: {}
  type: ClusterIP
  protocol: TCP
  port: 12001
  grpcport: 12011
  gitsyncgrpcport: 14002
  pmssdkgrpcport: 15302
resources:
  limits:
    memory: 6144Mi
  requests:
    cpu: 1
    memory: 6144Mi
autoscaling:
  enabled: false
  targetMemory: ""
  targetCPU: 70
nodeSelector: {}
tolerations: []
affinity: {}
imagePullSecrets: {}
additionalConfigs: {}
