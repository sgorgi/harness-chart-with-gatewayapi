virtualService:
  annotations: {}
  objects:
    - name: harness-manager-api
      pathMatchType: prefix
      pathRewrite: "/api/"
      paths:
        ## fix for admin portal -> gateway call
        - path: '{{ .Values.global.istio.virtualService.pathPrefix }}/api/data-handler/'
          pathRewrite: ""
          backend:
            service:
              name: gateway
              port: 80
        - path: '{{ .Values.global.istio.virtualService.pathPrefix }}/api/swagger/'
          backend:
            service:
              port: 9999
        - path: '{{ .Values.global.istio.virtualService.pathPrefix }}/api/'
    - name: harness-manager-stream
      pathMatchType: prefix
      pathRewrite: "/stream/"
      paths:
        - path: '{{ .Values.global.istio.virtualService.pathPrefix }}/stream/'
ingress:
  annotations: {}
  objects:
    - name: harness-manager-api
      annotations:
        nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
        nginx.ingress.kubernetes.io/rewrite-target: /api$1$2
      paths:
        - path: '{{ .Values.global.ingress.pathPrefix }}/api(/|$)(.*)'
        - path: '{{ .Values.global.ingress.pathPrefix }}/api/swagger(/|$)(.*)'
          backend:
            service:
              port: 9999
    - name: harness-manager-stream
      annotations:
        nginx.ingress.kubernetes.io/rewrite-target: /stream$1$2
      paths:
        - path: '{{ .Values.global.ingress.pathPrefix }}/stream(/|$)(.*)'
