    name: harness-secrets
    key: mongodbUsername
  password:
image:
  registry: docker.io
  digest: "sha256:9229131f97651211d380eabe0737acb3c407784aadcb237c7e6315a8b87010c6"
  repository: harnesssecure/debezium-service-signed
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "1.27.0"
serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "harness-default"
probes:
  readinessProbe:
    httpGet:
      path: /api/health
      port: 14552
    timeoutSeconds: 2
    periodSeconds: 5
    failureThreshold: 5
    initialDelaySeconds: 60
    successThreshold: 1
  livenessProbe:
    httpGet:
      path: /api/health
      port: 14552
    timeoutSeconds: 2
    periodSeconds: 10
    failureThreshold: 5
    successThreshold: 1
ingress:
  objects:
    - annotations:
        nginx.ingress.kubernetes.io/rewrite-target: /$2
        nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
        nginx.ingress.kubernetes.io/use-regex: "true"
      paths:
        - path: '{{ .Values.global.ingress.pathPrefix }}/debezium(/|$)(.*)'
podAnnotations: {}
podSecurityContext: {}
securityContext:
  runAsUser: 65534
  runAsNonRoot: true
virtualService:
  annotations: {}
  objects:
    - pathMatchType: prefix
      pathRewrite: "/"
      paths:
        - path: '{{ .Values.global.istio.virtualService.pathPrefix }}/debezium/'
