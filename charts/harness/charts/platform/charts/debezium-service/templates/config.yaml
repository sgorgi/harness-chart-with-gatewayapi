apiVersion: v1
kind: ConfigMap
metadata:
  name: debezium-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- if .Values.global.commonLabels }}
      {{- include "harnesscommon.tplvalues.render" ( dict "value" .Values.global.commonLabels "context" $ ) | nindent 4 }}
      {{- end }}
  {{- if .Values.global.commonAnnotations }}
  annotations: {{- include "harnesscommon.tplvalues.render" ( dict "value" .Values.global.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
data:
  {{- include "harnesscommon.tplvalues.render" ( dict "value" .Values.config "context" $) | nindent 2}}
  {{ include "harnesscommon.harnessfunctions.java17flags" (dict "context" $) | nindent 2 }}
  {{- if .Values.additionalConfigs }}
  {{- toYaml .Values.additionalConfigs | nindent 2 }}
  {{- end }}
  {{- include "harnesscommon.monitoring.config" . | nindent 2 }}
  {{- include "harnesscommon.logging.setFileLogging" . | nindent 2 }}
  {{- include "harnesscommon.secretsLoader.configContent" (dict "ctx" $ "databaseSecrets" (list 
    (dict "dbtype" "mongo" "usernamesecrets" (list "NGHARNESS_MONGO_USER" "PMSHARNESS_MONGO_USER" "HARNESS_MONGO_USER" "COMPONENTHARNESS_MONGO_USER" "IDPHARNESS_MONGO_USER" "GITOPSHARNESS_MONGO_USER" "TEMPLATEHARNESS_MONGO_USER") "passwordsecrets" (list "NGHARNESS_MONGO_PASSWORD" "PMSHARNESS_MONGO_PASSWORD" "HARNESS_MONGO_PASSWORD" "COMPONENTHARNESS_MONGO_PASSWORD" "IDPHARNESS_MONGO_PASSWORD" "GITOPSHARNESS_MONGO_PASSWORD" "TEMPLATEHARNESS_MONGO_PASSWORD"))
    (dict "dbtype" "redis" "usernamesecrets" (list "REDIS_LOCK_CONFIG_REDIS_USERNAME" "EVENTS_FRAMEWORK_REDIS_USERNAME" "SNAPSHOT_EVENTS_FRAMEWORK_USERNAME") "passwordsecrets" (list "REDIS_LOCK_CONFIG_REDIS_PASSWORD" "EVENTS_FRAMEWORK_REDIS_PASSWORD" "SNAPSHOT_EVENTS_FRAMEWORK_PASSWORD"))
  )) | nindent 2}}
