{{- define "access-control.shadowTap.captureRequestLua" -}}
-- Snapshot headers before yield.
local headers = handle:headers()
local method = headers:get(":method") or ""
local path = headers:get(":path") or ""
local authorization = headers:get("authorization") or ""
local x_api_key = headers:get("x-api-key") or ""
local request_id = headers:get("x-request-id") or ""
headers = nil

-- Yield: buffer full request body.
local body = handle:body()
local req_body = ""
if body ~= nil and body:length() > 0 then
  req_body = body:getBytes(0, body:length())
end
body = nil

-- Stash bundle in dynamic metadata for the dispatcher's response hook.
local md = handle:streamInfo():dynamicMetadata()
md:set("acs.shadow", "method", method)
md:set("acs.shadow", "path", path)
md:set("acs.shadow", "authorization", authorization)
md:set("acs.shadow", "x_api_key", x_api_key)
md:set("acs.shadow", "request_id", request_id)
md:set("acs.shadow", "req_body", req_body)
{{- end -}}
{{- if .Values.shadowTap.enabled }}
{{- $splitEnabled := gt (len .Values.shadowTap.split.accountIds) 0 -}}
{{- $allowRegex := join "|" .Values.shadowTap.split.accountIds -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "access-control.name" . }}-envoy-sidecar
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "access-control.labels" . | nindent 4 }}
data:
  envoy.yaml: |
    admin:
      address:
        socket_address:
          address: 0.0.0.0
          port_value: {{ .Values.shadowTap.envoy.adminPort }}

    static_resources:
      listeners:
      - name: acs_ingress
        address:
          socket_address:
            address: 0.0.0.0
            port_value: {{ .Values.shadowTap.envoy.listenerPort }}
        per_connection_buffer_limit_bytes: {{ .Values.shadowTap.envoy.perConnectionBufferLimitBytes }}
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: acs_ingress
              generate_request_id: false
              request_timeout: 15s
              route_config:
                name: local_route
                virtual_hosts:
                - name: acs
                  domains: ["*"]
                  routes:
                  {{- if $splitEnabled }}
                  # Route 1: account in allow list -> primary v3, no shadow.
                  - name: v3_primary
                    match:
                      prefix: "{{ .Values.shadowTap.match.pathPrefix }}"
                      headers:
                      - name: ":method"
                        string_match:
                          exact: "{{ .Values.shadowTap.match.method }}"
                      - name: "x-acs-account-id"
                        string_match:
                          safe_regex:
                            regex: "^({{ $allowRegex }})$"
                    route:
                      cluster: acs_3_cluster
                      timeout: 30s
                  # Route 2: first-pass extraction (header not present yet).
                  # Buffers body, regex-extracts accountIdentifier, sets header,
                  # clearRouteCache(); request re-routes to route 1, 3, or 4.
                  - name: account_extraction
                    match:
                      prefix: "{{ .Values.shadowTap.match.pathPrefix }}"
                      headers:
                      - name: ":method"
                        string_match:
                          exact: "{{ .Values.shadowTap.match.method }}"
                      - name: "x-acs-account-id"
                        present_match: false
                    typed_per_filter_config:
                      lua.account_extractor:
                        "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.LuaPerRoute
                        source_code:
                          inline_string: |
                            function envoy_on_request(handle)
                              {{- include "access-control.shadowTap.captureRequestLua" . | nindent 30 }}

                              -- Extract account ID. Two mutually exclusive body shapes:
                              --   1. permissions[].resourceScope.accountIdentifier
                              --      (any non-ACCOUNT permission carries resourceScope)
                              --   2. permissions[].resourceIdentifier
                              --      (only when resourceType=ACCOUNT; no resourceScope)
                              -- Invariant: a body either has accountIdentifier somewhere, OR
                              -- every permission is resourceType=ACCOUNT (so the first
                              -- resourceIdentifier is the account). Lua patterns lack
                              -- alternation, so try accountIdentifier first, fall back.
                              -- WARNING: if a future API adds resourceIdentifier on a
                              -- non-ACCOUNT resource without accountIdentifier in the body,
                              -- the fallback will return the wrong value.
                              local account = string.match(req_body,
                                '"accountIdentifier"%s*:%s*"([^"]+)"')
                              if account == nil then
                                account = string.match(req_body,
                                  '"resourceIdentifier"%s*:%s*"([^"]+)"')
                              end
                              if account ~= nil and account ~= "" then
                                handle:headers():add("x-acs-account-id", account)
                                handle:clearRouteCache()
                              end
                            end
                    route:
                      cluster: acs_2_cluster
                      timeout: 30s
                  {{- end }}
                  # Route 3: sampled v2 -> fire-and-forget shadow to v3.
                  - name: v2_sampled
                    match:
                      prefix: "{{ .Values.shadowTap.match.pathPrefix }}"
                      headers:
                      - name: ":method"
                        string_match:
                          exact: "{{ .Values.shadowTap.match.method }}"
                      runtime_fraction:
                        default_value:
                          numerator: {{ .Values.shadowTap.samplingPercent }}
                          denominator: HUNDRED
                        runtime_key: acs.shadow_sampling
                    typed_per_filter_config:
                      lua.shadow_dispatcher:
                        "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.LuaPerRoute
                        source_code:
                          inline_string: |
                            function envoy_on_request(handle)
                              -- If extractor already stashed bundle, skip re-buffering.
                              local stash = handle:streamInfo():dynamicMetadata():get("acs.shadow")
                              if stash ~= nil then return end
                              {{- include "access-control.shadowTap.captureRequestLua" . | nindent 30 }}
                            end

                            function envoy_on_response(handle)
                              local shadow = handle:streamInfo():dynamicMetadata():get("acs.shadow")
                              if shadow == nil then return end
                              local method = shadow["method"] or ""
                              local orig_path = shadow["path"] or ""
                              local authorization = shadow["authorization"] or ""
                              local x_api_key = shadow["x_api_key"] or ""
                              local request_id = shadow["request_id"] or ""
                              local req_body = shadow["req_body"] or ""
                              shadow = nil

                              local body = handle:body()
                              local resp_body = ""
                              if body ~= nil and body:length() > 0 then
                                resp_body = body:getBytes(0, body:length())
                              end
                              body = nil

                              if req_body == "" then req_body = "null" end
                              if resp_body == "" then resp_body = "null" end

                              local wrapped = string.format(
                                '{"request":%s,"expectedResponse":%s}', req_body, resp_body)

                              local q_idx = string.find(orig_path, "?", 1, true)
                              local shadow_path
                              if q_idx then
                                shadow_path = string.sub(orig_path, 1, q_idx - 1)
                                  .. "/shadow" .. string.sub(orig_path, q_idx)
                              else
                                shadow_path = orig_path .. "/shadow"
                              end

                              handle:httpCall(
                                "acs_3_cluster",
                                {
                                  [":method"] = method,
                                  [":path"] = shadow_path,
                                  [":authority"] = "{{ .Values.shadowTap.sink.host }}",
                                  ["content-type"] = "application/json",
                                  ["authorization"] = authorization,
                                  ["x-api-key"] = x_api_key,
                                  ["x-request-id"] = request_id,
                                },
                                wrapped,
                                2000,
                                true
                              )
                            end
                    route:
                      cluster: acs_2_cluster
                      timeout: 30s
                  # Route 4: default v2 (no shadow).
                  - name: v2_default
                    match:
                      prefix: "{{ .Values.shadowTap.match.pathPrefix }}"
                      headers:
                      - name: ":method"
                        string_match:
                          exact: "{{ .Values.shadowTap.match.method }}"
                    route:
                      cluster: acs_2_cluster
                      timeout: 30s
                  # Route 5: catch-all (non-/api/acl).
                  - name: catch_all
                    match: { prefix: "/" }
                    route:
                      cluster: acs_2_cluster
                      timeout: 30s
              http_filters:
              # Carrier filter for route-scoped extraction Lua. Default = no-op;
              # only the account_extraction route overrides it.
              - name: lua.account_extractor
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                  default_source_code:
                    inline_string: |
                      function envoy_on_request(handle) end
              # Carrier filter for route-scoped shadow Lua. Default = no-op;
              # only the v2_sampled route overrides it.
              - name: lua.shadow_dispatcher
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                  default_source_code:
                    inline_string: |
                      function envoy_on_request(handle) end
                      function envoy_on_response(handle) end
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

      clusters:
      - name: acs_2_cluster
        connect_timeout: 2s
        type: STATIC
        load_assignment:
          cluster_name: acs_2_cluster
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: 127.0.0.1
                    port_value: {{ .Values.service.port }}

      - name: acs_3_cluster
        connect_timeout: 2s
        type: STRICT_DNS
        lb_policy: LEAST_REQUEST
        dns_refresh_rate: 10s
        circuit_breakers:
          thresholds:
          - priority: DEFAULT
            max_connections: {{ .Values.shadowTap.sink.circuitBreakers.maxConnections }}
            max_pending_requests: {{ .Values.shadowTap.sink.circuitBreakers.maxPendingRequests }}
            max_requests: {{ .Values.shadowTap.sink.circuitBreakers.maxRequests }}
            max_retries: 0
        load_assignment:
          cluster_name: acs_3_cluster
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: {{ .Values.shadowTap.sink.host | quote }}
                    port_value: {{ .Values.shadowTap.sink.port }}
{{- end }}
