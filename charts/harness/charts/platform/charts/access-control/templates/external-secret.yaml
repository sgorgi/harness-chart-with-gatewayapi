{{- if eq (include "harnesscommon.secretsLoader.enabled" (dict "ctx" $)) "false" }}
{{- if eq (include "harnesscommon.secrets.hasESOSecrets" (dict "secretsCtx" .Values.secrets)) "true" }}
    {{- $localESOSecretIdentifier := (include "harnesscommon.secrets.localESOSecretCtxIdentifier" (dict "ctx" $ )) }}
    {{ include "harnesscommon.secrets.generateExternalSecret" (dict "secretsCtx" .Values.secrets "secretNamePrefix" $localESOSecretIdentifier) }}
    {{- print "\n---" }}
{{- end }}
{{- include "harnesscommon.dbv3.generateLocalMongoExternalSecret" (dict "ctx" $) }}
{{- include "harnesscommon.dbv3.generateLocalRedisExternalSecret" (dict "ctx" $) }}
{{- if and .Values.database.postgres .Values.database.postgres.enabled (eq (include "harnesscommon.secrets.hasESOSecrets" (dict "secretsCtx" .Values.database.postgres.secrets)) "true") }}
  {{- $localPostgresESOSecretIdentifier := (include "harnesscommon.secrets.localESOSecretCtxIdentifier" (dict "ctx" $ "additionalCtxIdentifier" "postgres")) }}
  {{- include "harnesscommon.secrets.generateExternalSecret" (dict "ctx" $ "secretsCtx" .Values.database.postgres.secrets "secretNamePrefix" $localPostgresESOSecretIdentifier) }}
{{- end }}
{{- end }}
