# -- shadowTap Envoy sidecar that mirrors matching traffic to ACS 3.0 for shadow comparison.
# When enabled, the Service targetPort is redirected to the sidecar listener, so all
# ingress traffic flows through Envoy before reaching the ACS container on loopback.
# A Lua filter samples eligible requests and, after the 2.0 response is produced, fires
# a fire-and-forget POST to 3.0 with the wrapped {originalBody, response2} body.
shadowTap:
  enabled: false
  match:
    # Only requests matching this prefix AND method are eligible for shadowing.
    pathPrefix: "/api/acl"
    method: "POST"
  # Sampling: shadow only a fraction of eligible requests (0-100).
  # 0 = shadow nothing, 100 = shadow every eligible request.
  samplingPercent: 10
  # Split mode: requests whose JSON body's top-level "accountIdentifier" field
  # matches one of these IDs are routed primarily to ACS 3.0 (no shadow).
  # All other /api/acl POSTs go to 2.0; samplingPercent of those are mirrored
  # to 3.0's /shadow endpoint. Empty list = pure shadow mode.
  split:
    accountIds: []
  # Skip shadowing when either the request body or the response body exceeds this
  # size. Guards 3.0's /shadow endpoint from pathologically large payloads.
  # 524288 = 512 KiB.
  # Not used right now
  maxBodyBytes: 524288
  sink:
    # ACS 3.0 Service that hosts the /shadow endpoint. Lua will POST the wrapped
    # body (originalBody + response2) to <original path>/shadow on this host.
    host: "access-control-v3"
    port: 9006
    circuitBreakers:
      maxConnections: 10240
      maxPendingRequests: 10240
      maxRequests: 10240
  envoy:
    image:
      repository: envoyproxy/envoy
      tag: v1.36.6
      pullPolicy: IfNotPresent
    listenerPort: 15001
    adminPort: 15000
    metrics:
      path: "/stats/prometheus"
      interval: "120s"
    logLevel: info
    # Per-connection TCP read/write buffer cap inside Envoy. Bounds RAM per active
    # connection. 1048576 = 1 MiB. Triggers TCP backpressure when exceeded.
    perConnectionBufferLimitBytes: "4194304"
    resources:
      requests:
        cpu: 100m
        memory: 2Gi
      limits:
        memory: 2Gi
