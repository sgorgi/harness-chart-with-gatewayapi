{{- if and .Values.postgresInitJob.enabled .Values.global.onprem (not .Values.global.database.postgres.installed) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: external-postgres-init
  namespace: {{ .Release.Namespace }}
  labels:
    chart: {{ .Chart.Name }}
    release: {{ .Release.Name }}
    version: {{ .Chart.Version }}
    {{- if .Values.global.commonLabels }}
    {{- include "harnesscommon.tplvalues.render" ( dict "value" .Values.global.commonLabels "context" $ ) | nindent 4 }}
    {{- end }}
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "0"
    "helm.sh/resource-policy": keep
    "helm.sh/hook-delete-policy": before-hook-creation
    {{- if .Values.global.commonAnnotations }}
    {{- include "harnesscommon.tplvalues.render" ( dict "value" .Values.global.commonAnnotations "context" $ ) | nindent 4 }}
    {{- end }}
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      name: external-postgres-init
      labels:
        app: external-postgres-init
    spec:
      {{- include "common.images.pullSecrets" (dict "images" (list .Values.postgresInitJob.image) "global" .Values.global ) | nindent 6 }}
      serviceAccountName: {{ .Values.postgresInitJob.serviceAccount.name }}
      restartPolicy: Never
      {{- with .Values.postgresInitJob.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.postgresInitJob.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.postgresInitJob.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: external-postgres-init
        image: {{ include "common.images.image" (dict "imageRoot" .Values.postgresInitJob.image "global" .Values.global) }}
        imagePullPolicy: {{ .Values.postgresInitJob.image.pullPolicy | default "IfNotPresent" }}
        env:
        {{- include "harnesscommon.dbconnectionv2.postgresEnv" (dict "ctx" $ "userVariableName" "PGUSER" "passwordVariableName" "PGPASSWORD") | nindent 8 }}
        - name: PGHOST
          value: {{ include "harnesscommon.dbconnectionv2.postgresHost" (dict "context" $) }}
        - name: PGPORT
          value: {{ include "harnesscommon.dbconnectionv2.postgresPort" (dict "context" $) | quote }}
        - name: PGSSLMODE
          value: {{ .Values.global.database.postgres.sslMode | default "disable" }}
        command:
        - /bin/sh
        - -c
        - |
          set -e

          echo "Creating databases if not exists..."
          psql -v ON_ERROR_STOP=1 -d postgres <<'EOSQL'
          {{- range .Values.postgresql.databases }}
          SELECT 'CREATE DATABASE "{{ .name }}"'
          WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '{{ .name }}')\gexec
          {{- end }}
          EOSQL

          echo "Setting up cron jobs if not exists..."
          psql -v ON_ERROR_STOP=1 -d postgres <<'EOSQL'
          CREATE EXTENSION IF NOT EXISTS pg_cron;
          DO $body$
          BEGIN
          {{- range .Values.postgresql.databases }}
          {{- if .partmanMaintenance }}
            IF NOT EXISTS (SELECT 1 FROM cron.job WHERE jobname = '{{ .name }}_partman_run_maintenance') THEN
              PERFORM cron.schedule_in_database('{{ .name }}_partman_run_maintenance', '0 1 * * *', 'select partman.run_maintenance()', '{{ .name }}');
            END IF;
          {{- end }}
          {{- end }}
          END
          $body$;
          EOSQL

          echo "External postgres init completed successfully."
        {{- with .Values.postgresInitJob.resources }}
        resources: {{- toYaml . | nindent 10 }}
        {{- end }}
{{- end }}
