virtualService:
  annotations: {}
  objects:
    - name: ng-manager
      pathMatchType: prefix
      pathRewrite: "/"
      paths:
        - path: '{{ .Values.global.istio.virtualService.pathPrefix }}/ng/api/delegate-token-ng'
          pathRewrite: "/api/delegate-token-ng"
          backend:
            service:
              name: harness-manager
              port: 9090
        - path: '{{ .Values.global.istio.virtualService.pathPrefix }}/ng/api/download-delegates'
          pathRewrite: "/api/download-delegates"
          backend:
            service:
              name: harness-manager
              port: 9090
        - path: '{{ .Values.global.istio.virtualService.pathPrefix }}/ng/api/delegate-setup'
          pathRewrite: "/api/delegate-setup"
          backend:
            service:
              name: harness-manager
              port: 9090
        - path: '{{ .Values.global.istio.virtualService.pathPrefix }}/ng/api/delegate-group-tags'
          pathRewrite: "/api/delegate-group-tags"
          backend:
            service:
              name: harness-manager
              port: 9090
        - path: '{{ .Values.global.istio.virtualService.pathPrefix }}/ng/api/agent-mtls'
          pathRewrite: "/api/agent-mtls"
          backend:
            service:
              name: harness-manager
              port: 9090
        - path: '{{ .Values.global.istio.virtualService.pathPrefix }}/ng/api/'
        - path: '{{ .Values.global.istio.virtualService.pathPrefix }}/ng-dashboard/api/'
          backend:
            service:
              name: ng-dashboard-aggregator
              port: 7100
        - path: '{{ .Values.global.istio.virtualService.pathPrefix }}/ng/'
          backend:
            service:
              name: next-gen-ui
              port: 80
    - name: ng-manager-v1-apis
      pathMatchType: regex
      pathRewrite: "/\\1"
      paths:
