replicaCount: 1
updateStrategy:
  rollingUpdate:
    maxSurge: 100%
    maxUnavailable: 0
  type: RollingUpdate
podLabels: {}
oidc:
  enabled: true
licenseManager:
  enabled: true
maxUnavailable: 0
allowedOrigins: ""
appLogLevel: "INFO"
image:
  registry: docker.io
  repository: harnesssecure/ng-manager-signed
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "1.150.5"
  digest: "sha256:fd8b99110fedd4dccb689b820a2ae14e14fe40fba5de8e8fa809d6bedd7422f7"
  imagePullSecrets: []
initContainer:
  image:
    registry: docker.io
    repository: busybox
    tag: "1.37.0"
    digest: "sha256:9532d8c39891ca2ecde4d30d7710e01fb739c87a8b9299685c63704296b16028"
    imagePullSecrets: []
mongoSecrets:
  userName:
    name: harness-secrets
    key: mongodbUsername
  password:
    name: mongodb-replicaset-chart
    key: mongodb-root-password
ceSecret:
  access_key:
    name: nextgen-ce
    key: AWS_ACCESS_KEY
  secret_key:
    name: nextgen-ce
    key: AWS_SECRET_KEY
  destination_bucket:
    name: nextgen-ce
    key: AWS_DESTINATION_BUCKET
  template_url:
    name: nextgen-ce
    key: AWS_TEMPLATE_LINK
ceGcpSetupConfigGcpProjectId: "placeHolderGcpProjectId"
timescaleSecret:
  password:
    name: harness-secrets
    key: timescaledbPostgresPassword
java:
  memory: "4096m"
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
podAnnotations: {}
imagePullSecrets: {}
podSecurityContext: {}
# fsGroup: 2000

securityContext:
  runAsUser: 65534
  runAsNonRoot: true
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000
probes:
  livenessProbe:
    httpGet:
      path: /admin/healthcheck/liveness
      port: 7458
      scheme: HTTP
    timeoutSeconds: 10
    periodSeconds: 60
    successThreshold: 1
    failureThreshold: 5
  readinessProbe:
    httpGet:
      path: /health
      port: http-ng-manager
      scheme: HTTP
    timeoutSeconds: 1
    periodSeconds: 5
    successThreshold: 1
    failureThreshold: 3
  startupProbe:
    httpGet:
      path: /health
      port: http-ng-manager
      scheme: HTTP
    initialDelaySeconds: 25
    timeoutSeconds: 1
    periodSeconds: 5
    successThreshold: 1
    failureThreshold: 40
service:
  annotations: {}
  type: ClusterIP
  protocol: TCP
  port: 7090
  grpcport: 9979
  gitsyncgrpcport: 13002
resources:
  limits:
    memory: 8192Mi
  requests:
    cpu: 2
    memory: 200Mi
autoscaling:
  enabled: false
  targetCPU: ""
  targetMemory: ""
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 120
terminationMessage: {}
nodeSelector: {}
tolerations: []
affinity: {}
additionalConfigs: {}
java17flags: ""
