apiVersion: v1
kind: ConfigMap
metadata:
  name: ng-manager
  namespace: '{{ .Release.Namespace }}'
  labels:
    {{- if .Values.global.commonLabels }}
    {{- include "harnesscommon.tplvalues.render" ( dict "value" .Values.global.commonLabels "context" $ ) | nindent 4 }}
    {{- end }}
  {{- if .Values.global.commonAnnotations }}
  annotations: {{- include "harnesscommon.tplvalues.render" ( dict "value" .Values.global.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
data:
  {{- include "harnesscommon.tplvalues.render" ( dict "value" .Values.config "context" $) | nindent 2}}
  {{ include "harnesscommon.harnessfunctions.java17flags" (dict "context" $) | nindent 2 }}
  {{- if .Values.additionalConfigs }}
  {{- toYaml .Values.additionalConfigs | nindent 2 }}
  {{- end }}
  {{- include "harnesscommon.monitoring.config" . | nindent 2 }}
  {{- include "harnesscommon.logging.setFileLogging" . | nindent 2 }}
  {{- include "harnesscommon.secretsLoader.configContent" (dict "ctx" $ "databaseSecrets" (list 
    (dict "dbtype" "mongo" "usernamesecrets" (list "NGHARNESS_MONGO_USER" "NOTIFICATIONS_MONGO_USER") "passwordsecrets" (list "NGHARNESS_MONGO_PASSWORD" "NOTIFICATIONS_MONGO_PASSWORD"))
    (dict "dbtype" "redis" "usernamesecrets" (list "LOCK_CONFIG_REDIS_USERNAME" "EVENTS_FRAMEWORK_REDIS_USERNAME") "passwordsecrets" (list "LOCK_CONFIG_REDIS_PASSWORD" "EVENTS_FRAMEWORK_REDIS_PASSWORD"))
    (dict "dbtype" "postgres" "usernamesecrets" (list "ALLOYDB_USERNAME") "passwordsecrets" (list "ALLOYDB_PASSWORD"))
    (dict "dbtype" "timescaledb" "usernamesecrets" (list "TIMESCALEDB_USERNAME" "SECONDARY_TIMESCALEDB_USERNAME") "passwordsecrets" (list "TIMESCALE_PASSWORD" "SECONDARY_TIMESCALE_PASSWORD"))
  )) | nindent 2}}

{{- if .Values.oidc.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: oidc-config-ng-manager
  namespace: '{{ .Release.Namespace }}'
  {{- if .Values.global.commonLabels }}
  labels:
    {{- include "harnesscommon.tplvalues.render" ( dict "value" .Values.global.commonLabels "context" $ ) | nindent 4 }}
  {{- end }}
  {{- if .Values.global.commonAnnotations }}
  annotations: {{- include "harnesscommon.tplvalues.render" ( dict "value" .Values.global.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
data:
  oidc_config.json: |
    {
      "OPENID_CONFIGURATION" : {
        "issuer": "{{ .Values.global.loadbalancerURL }}/ng/api/oidc/account/{account_id}",
        "jwks_uri": "{{ .Values.global.loadbalancerURL }}/ng/api/oidc/account/{account_id}/.wellknown/jwks",
        "subject_types_supported":["public","pairwise"],
        "response_types_supported":["id_token"],
        "claims_supported":
        [
          "sub","aud","exp","iat","iss","account_id"
        ],
        "id_token_signing_alg_values_supported":["RS256"],
        "scopes_supported":["openid"]
      },
      "AWS": {
        "header": {
          "typ": "JWT",
          "alg": "RS256",
          "kid": "GENERATE_AT_RUNTIME"
        },
        "payload": {
          "sub": "{account_id}",
          "aud": "sts.amazonaws.com",
          "iss": "{{ .Values.global.loadbalancerURL }}/ng/api/oidc/account/{account_id}",
          "exp": 3600,
          "iat": 0,
          "account_id": "{account_id}"
        }
      },
      "CUSTOM": {
        "header": {
          "typ": "JWT",
          "alg": "RS256",
          "kid": "GENERATE_AT_RUNTIME"
        },
        "payload": {
          "sub": "{account_id}",
          "iss": "{{ .Values.global.loadbalancerURL }}/ng/api/oidc/account/{account_id}",
          "exp": 3600,
          "iat": 0,
          "account_id": "{account_id}"
        }
      },
      "GCP": {
        "header": {
          "typ": "JWT",
          "alg": "RS256",
          "kid": "GENERATE_AT_RUNTIME"
        },
        "payload": {
          "sub": "{account_id}",
          "aud": "https://iam.googleapis.com/projects/{gcp_project_id}/locations/global/workloadIdentityPools/{workload_pool_id}/providers/{provider_id}",
          "iss": "{{ .Values.global.loadbalancerURL }}/ng/api/oidc/account/{account_id}",
          "exp": 3600,
          "iat": 0,
          "account_id": "{account_id}"
        },
        "access_token_sts_endpoint": "https://sts.googleapis.com",
        "access_token_iam_sa_credentials_endpoint": "https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/",
        "workload_access_token_config": {
          "audience": "//iam.googleapis.com/projects/{gcp_project_id}/locations/global/workloadIdentityPools/{workload_pool_id}/providers/{provider_id}",
          "grant_type": "urn:ietf:params:oauth:grant-type:token-exchange",
          "requested_token_type": "urn:ietf:params:oauth:token-type:access_token",
          "scope": "https://www.googleapis.com/auth/cloud-platform",
          "subject_token_type": "urn:ietf:params:oauth:token-type:id_token",
          "subject_token": "{SUBJECT_TOKEN_TYPE}",
          "options": {
            "userProject": "{gcp_project_id}"
          }
        }
      },
      "VAULT": {
        "header": {
          "typ": "JWT",
          "alg": "RS256",
          "kid": "GENERATE_AT_RUNTIME"
        },
        "payload": {
          "sub": "{account_id}",
          "aud": "{vault_jwt_auth_path}",
          "iss": "{{ .Values.global.loadbalancerURL }}/ng/api/oidc/account/{account_id}",
          "exp": 3600,
          "iat": 0,
          "account_id": "{account_id}"
        }
      },
      "AZURE": {
        "header": {
          "typ": "JWT",
          "alg": "RS256",
          "kid": "GENERATE_AT_RUNTIME"
        },
        "payload": {
          "sub": "{account_id}",
          "aud": "api://AzureADTokenExchange",
          "iss": "{{ .Values.global.loadbalancerURL }}/ng/api/oidc/account/{account_id}",
          "exp": 3600,
          "iat": 0,
          "account_id": "{account_id}"
        }
      },   
      "ARTIFACTORY": {
        "header": {
          "typ": "JWT",
          "alg": "RS256",
          "kid": "GENERATE_AT_RUNTIME"
        },
        "payload": {
          "sub": "{account_id}",
          "aud": "{artifactory_audience}",
          "iss": "{{ .Values.global.loadbalancerURL }}/ng/api/oidc/account/{account_id}",
          "exp": 3600,
          "iat": 0,
          "account_id": "{account_id}"
        }
      }
    }
{{- end }}

{{- if .Values.licenseManager.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: devops-essentials-config-ng-manager
  namespace: '{{ .Release.Namespace }}'
  {{- if .Values.global.commonLabels }}
