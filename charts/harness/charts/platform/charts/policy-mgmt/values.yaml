  targetCPU: ""
  targetMemory: ""
nodeSelector: {}
tolerations: []
affinity: {}
progressDeadlineSeconds: 600
updateStrategy:
  rollingUpdate:
    maxSurge: 100%
    maxUnavailable: 0
  type: RollingUpdate
terminationGracePeriodSeconds: "30"
terminationMessage: {}
