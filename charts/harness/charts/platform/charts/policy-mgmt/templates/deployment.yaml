apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "policy-mgmt.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "policy-mgmt.labels" . | nindent 4 }}
    {{- if .Values.global.commonLabels }}
    {{- include "harnesscommon.tplvalues.render" ( dict "value" .Values.global.commonLabels "context" $ ) | nindent 4 }}
    {{- end }}
  {{- if .Values.global.commonAnnotations }}
  annotations: {{- include "harnesscommon.tplvalues.render" ( dict "value" .Values.global.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
spec:
  progressDeadlineSeconds: {{ .Values.progressDeadlineSeconds }}
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end}}
  {{- if .Values.updateStrategy }}
  strategy: {{- toYaml .Values.updateStrategy | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "policy-mgmt.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- include "harnesscommon.monitoring.annotations" . | nindent 8 }}
        {{- if .Values.global.commonAnnotations }}
          {{- include "harnesscommon.tplvalues.render" ( dict "value" .Values.global.commonAnnotations "context" $ ) | nindent 8 }}
        {{- end }}
      labels:
        app: {{ include "policy-mgmt.name" . }}
        {{- include "policy-mgmt.selectorLabels" . | nindent 8 }}
        {{- if .Values.global.commonLabels }}
        {{- include "harnesscommon.tplvalues.render" ( dict "value" .Values.global.commonLabels "context" $ ) | nindent 8 }}
        {{- end }}
        {{- if .Values.podLabels }}
        {{- include "harnesscommon.tplvalues.render" (dict "value" .Values.podLabels "context" $) | nindent 8 }}
        {{- end }}
    spec:
      {{ include "policy-mgmt.pullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "policy-mgmt.serviceAccountName" . }}
      {{- if .Values.podSecurityContext }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- end }}
      {{- if .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- end }}
      initContainers:
          {{- include "harnesscommon.secretsLoader.initContainer" (dict "ctx" $) | nindent 8 }}
      {{- if and .Values.securityContext .Values.securityContext.readOnlyRootFilesystem }}
          {{ include "harnesscommon.initContainer.setupWritable" (dict "root" . "destinationPath" "/shared/volume" "sourcePath" "/app" "volumeName" "app") | nindent 8 }}
      {{- end }}
      {{- if .Values.global.database.postgres.installed }}
          {{ include "harnesscommon.initContainer.waitForContainer" (dict "root" . "containerName" "wait-for-postgres" "appName" "postgres") | nindent 8}}
      {{- end }}
      containers:
        - name: {{ include "policy-mgmt.name" . }}
          {{- if .Values.securityContext }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- end }}
          image: {{ include "common.images.image" (dict "imageRoot" .Values.image "global" .Values.global) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if eq (include "harnesscommon.secretsLoader.enabled" (dict "ctx" $)) "true" }}
          command: {{- include "harnesscommon.secretsLoader.command" (dict "ctx" $) | nindent 12 }}
          args: {{- include "harnesscommon.secretsLoader.args" (dict "ctx" $ "entry_point" "/app/policy-mgmt server" "secrets_loader_cmd" "true") | nindent 12 }}
          {{- end }}          
          envFrom:
            - configMapRef:
                name: {{ include "policy-mgmt.name" . }}
          ports:
            - name: http
              containerPort: {{.Values.service.port}}
              protocol: TCP
            {{- include "harnesscommon.monitoring.containerPort" . | nindent 12 }}
          volumeMounts:
            {{- include "harnesscommon.secretsLoader.volumeMounts" (dict "ctx" $) | nindent 12 }}
            {{- if and .Values.securityContext .Values.securityContext.readOnlyRootFilesystem }}
            {{- include "harnesscommon.volumeMounts" (dict "mounts" (list (dict "name" "app" "mountPath" "/app") (dict "name" "tmp" "mountPath" "/tmp")) ) | nindent 12 }}
            {{- end }}
            {{- if eq (include "harnesscommon.secretsLoader.enabled" (dict "ctx" $)) "false" }}
            {{- include "harnesscommon.mountRenderedSecretsAsVolumeMounts" (dict "ctx" $) | indent 12}}
            {{- end }}
            {{- if (hasKey .Values.global.database.redis "ssl") }}
            {{- include "harnesscommon.dbv4.sslVolumeMount" (dict "context" $ "dbType" "redis" "dbName" "events") | nindent 12 }}
            {{- end }}
            {{- if (hasKey .Values.global.database.postgres "ssl") }}
            {{- include "harnesscommon.dbv4.sslVolumeMount" (dict "context" $ "dbType" "postgres" "dbName" "postgres") | nindent 12 }}
            {{- end }}
            {{- if .Values.extraVolumeMounts }}
            {{- toYaml .Values.extraVolumeMounts | nindent 12 }}
            {{- end }}
          env:
            {{- include "harnesscommon.dbv4.sslEnv" (dict "context" $ "dbType" "redis" "dbName" "events" "variableNames" ( dict "sslEnabled" "APP_EVENTS_FRAMEWORK_REDIS_SSL_ENABLED" "sslCACertPath" "APP_EVENTS_FRAMEWORK_REDIS_SSL_CA_PATH")) | indent 12 }}
            {{- include "harnesscommon.dbv4.sslEnv" (dict "context" $ "dbType" "postgres" "dbName" "postgres" "variableNames" ( dict "sslEnabled" "PG_SSL_ENABLED" "sslCACertPath" "PG_SSLROOTCERT" "sslCertPath" "PG_SSLCERT" "sslKeyPath" "PG_SSLKEY")) | indent 12 }}
            {{- if eq (include "harnesscommon.secretsLoader.enabled" (dict "ctx" $)) "false" }}
            {{- include "harnesscommon.dbv3.redisEnv" (dict "ctx" $ "database" "events" "userVariableName" "APP_EVENTS_FRAMEWORK_REDIS_USERNAME" "passwordVariableName" "APP_EVENTS_FRAMEWORK_REDIS_PASSWORD" ) | indent 12 }}
            {{- include "harnesscommon.dbconnectionv2.postgresEnv" (dict "ctx" $ "userVariableName" "APP_DATABASE_USER" "passwordVariableName" "APP_DATABASE_PASSWORD") | indent 12 }}
            {{- include "harnesscommon.renderSecretsAsEnvironmentVariables" (dict "ctx" $) | indent 12}}
            {{- end }}

            - name: APP_DATABASE_DATASOURCE
              value: {{ include "policy-mgmt.postgresConnection" (dict "context" $ "database" "$(APP_DATABASE_DBNAME)" "userVariableName" "DBUSER" "passwordVariableName" "DBPASSWORD" "keywordValueConnectionString" true "localDBCtx" .Values.postgres) | quote }}
            - name: PG_SSLMODE
              value: {{ .Values.config.PG_SSLMODE | default "disable" | quote }}
            - name: BILLING_METRICS_TOPIC_NAME
              valueFrom:
                configMapKeyRef:
                  name: billing-metrics-shared-config
                  key: BILLING_METRICS_TOPIC_NAME
                  optional: true

          {{- toYaml .Values.probes | nindent 10 }}
          {{- if .Values.resources }}
          resources:
            {{- include "harnesscommon.tplvalues.render" (dict "value" .Values.resources "context" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.terminationMessage }}
            {{- toYaml .Values.terminationMessage | nindent 10 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - {{ include "policy-mgmt.name" . }}
            topologyKey: "kubernetes.io/hostname"
      {{- with .Values.affinity }}
        {{- toYaml . | nindent 8 }}
      {{- end }}      
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        {{- include "harnesscommon.secretsLoader.volumes" (dict "ctx" $) | nindent 8 }}
        {{- if and .Values.securityContext .Values.securityContext.readOnlyRootFilesystem }}
        {{- include "harnesscommon.volumes" (dict "volumes" (list (dict "name" "app" "type" "emptyDir") (dict "name" "tmp" "type" "emptyDir")) ) | nindent 8 }}
        {{- end }}
        {{- if eq (include "harnesscommon.secretsLoader.enabled" (dict "ctx" $)) "false" }}
        {{- include "harnesscommon.renderSecretsAsVolumes" (dict "ctx" $) | indent 8 }}
        {{- end }}
        {{- if (hasKey .Values.global.database.redis "ssl") }}
        {{- include "harnesscommon.dbv4.sslVolume" (dict "context" $ "dbType" "redis" "dbName" "events") | indent 8 }}
        {{- end }}
        {{- if (hasKey .Values.global.database.postgres "ssl") }}
        {{- include "harnesscommon.dbv4.sslVolume" (dict "context" $ "dbType" "postgres" "dbName" "postgres") | indent 8 }}
        {{- end }}
        {{- if .Values.extraVolumes }}
        {{- toYaml .Values.extraVolumes | nindent 8 }}
        {{- end }}
