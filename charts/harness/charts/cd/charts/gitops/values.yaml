# Default values for gitops.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1
updateStrategy:
  rollingUpdate:
    maxSurge: 100%
    maxUnavailable: 0
  type: RollingUpdate
global:
  logLevel: debug
  autoscaling:
    enabled: false
  fips: false
  pdb:
    create: false
  loadbalancerURL: ""
  loadbalancerContext: ""
  commonAnnotations: {}
  commonLabels: {}
  monitoring:
    enabled: false
    managedPlatform: ""
  externalSecretsLoader:
    enabled: false
    provider: "vault"
    image:
      repository: "repo/image"
      tag: "tag"
      pullPolicy: "IfNotPresent"
    vault:
      address: ""
      engine: ""
      basePath: ""
      auth:
        method: "token"
        # For Token auth:
        token: "vault-token"
        # For AppRole:
        roleId: ""
        secretId: ""
        # For Kubernetes auth:
        role: ""
    databases:
      mongo:
        useDatabaseSecretsEngine: false
        engine: ""
        overridePath: ""
        databaseRole: ""
      redis:
        useDatabaseSecretsEngine: false
        engine: ""
        overridePath: ""
        databaseRole: ""
      postgres:
        useDatabaseSecretsEngine: false
        engine: ""
        basePath: ""
        databaseRole: ""
  database:
    postgres:
      ## - installed = true if installed within cluster
      installed: true
      ## - protocol to use for connection
      protocol: postgres
      ## - host array for external
      hosts:
        - postgres:5432
      ## - secret name containing external values
      secretName: ""
      ## - key within secret containing username
      userKey: ""
      ## - key within secret containing password
      passwordKey: ""
      ## - extra arguments set to connection string
      extraArgs: ""
    mongo:
      installed: true
      protocol: mongodb+srv
      # --  provide default values if mongo.installed is set to false
      hosts: []
      secretName: ""
      userKey: ""
      passwordKey: ""
      extraArgs: ""
      secrets:
        kubernetesSecrets:
          - secretName: ""
            keys:
              MONGO_USER: ""
              MONGO_PASSWORD: ""
        secretManagement:
          externalSecretsOperator:
            - secretStore:
                name: ""
                kind: ""
              remoteKeys:
                MONGO_USER:
                  name: ""
                  property: ""
                MONGO_PASSWORD:
                  name: ""
                  property: ""
    timescaledb:
      installed: true
      protocol: "jdbc:postgresql"
      # --  provide default values if mongo.installed is set to false
      hosts:
        - timescaledb-single-chart:5432
      secretName: ""
      userKey: ""
      passwordKey: ""
      extraArgs: ""
      sslEnabled: false
      certName: ""
      certKey: ""
      secrets:
        kubernetesSecrets:
          - secretName: ""
            keys:
              TIMESCALEDB_USERNAME: ""
              TIMESCALEDB_PASSWORD: ""
              TIMESCALEDB_SSL_ROOT_CERT: ""
        secretManagement:
          externalSecretsOperator:
            - secretStore:
                name: ""
                kind: ""
              remoteKeys:
                TIMESCALEDB_USERNAME:
                  name: ""
                  property: ""
                TIMESCALEDB_PASSWORD:
                  name: ""
                  property: ""
                TIMESCALEDB_SSL_ROOT_CERT:
                  name: ""
                  property: ""
    redis:
      installed: true
      protocol: "redis"
      # --  provide default values if redis.installed is set to false
      hosts:
        - redis:6379
      secretName: ""
      userKey: ""
      passwordKey: ""
      extraArgs: ""
      ssl:
        secret: ""
        enabled: false
        caFileKey: ""
        trustStoreKey: ""
        trustStorePasswordKey: ""
      secrets:
        kubernetesSecrets:
          - secretName: ""
            keys:
              REDIS_USERNAME: ""
              REDIS_PASSWORD: ""
        secretManagement:
          externalSecretsOperator:
            - secretStore:
                name: ""
                kind: ""
              remoteKeys:
                REDIS_USERNAME:
                  name: ""
                  property: ""
                REDIS_PASSWORD:
                  name: ""
                  property: ""
                REDIS_CA:
                  name: ""
                  property: ""
                REDIS_SSL_CA_TRUST_STORE_PASSWORD:
                  name: ""
                  property: ""
  ingress:
    disableHostInIngress: false
    pathPrefix: ""
    pathType: ""
    enabled: false
    hosts:
      - 'my-host.example.org'
    tls:
      enabled: false
      secretName: harness-ssl
    objects:
      annotations: {}
  istio:
    enabled: false
    gateway:
      create: false
    virtualService:
      gateways:
      hosts:
  internalIngress:
    enabled: false
  waitForInitContainer:
    enabled: true
    image:
      registry: docker.io
      repository: harnesssecure/helm-init-container
      pullPolicy: Always
      tag: "latest"
      digest: "sha256:3e1e82d9f415e823193a5c48f9f782326e985107cf16c91081cbf5ed41249678"
      imagePullSecrets: []
monitoring:
  path: /gitops/metrics
  port: 6565
progressDeadlineSeconds: 600
probes:
  livenessProbe:
    httpGet:
      path: /healthz
      port: 7908
    initialDelaySeconds: 3
    periodSeconds: 30
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /healthz
      port: 7908
    initialDelaySeconds: 3
    periodSeconds: 30
    failureThreshold: 3
terminationMessage: {}
image:
  registry: docker.io
  repository: harnesssecure/gitops-service-signed
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "1.58.0"
  digest: "sha256:ae6064c085770962fb79d94f9dfe6ace93ba2e7114d7c8039dcae90e34463a3e"
  imagePullSecrets: []
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "harness-default"
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
# fsGroup: 2000

securityContext: {}
# capabilities:
#   drop:
#   - ALL
# readOnlyRootFilesystem: true
# runAsNonRoot: true
# runAsUser: 1000

service:
  annotations: {}
  type: ClusterIP
  httpServerPort: 7908
  grpcServerPort: 7909
  port: 80
  httpBind: ":7908"
virtualService:
  annotations: {}
  objects:
    - name: harness-gitops
      pathMatchType: prefix
      pathRewrite: "/"
      paths:
        - path: '{{ .Values.global.istio.virtualService.pathPrefix }}/gitops/'
          backend:
            service:
              port: 7908
resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  limits:
    memory: 256Mi
  requests:
    cpu: 2
    memory: 256Mi
autoscaling:
  enabled: false
  targetCPU: ""
  targetMemory: ""
nodeSelector: {}
tolerations: []
affinity: {}
ingress:
  objects:
    - name: gitops-http
      annotations:
        nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
        nginx.ingress.kubernetes.io/rewrite-target: /$2
        nginx.ingress.kubernetes.io/use-regex: "true"
      paths:
        - path: '{{ .Values.global.ingress.pathPrefix }}/gitops(/|$)(.*)'
          backend:
            service:
              port: 7908
upgraderImage:
  image:
    registry: docker.io
    repository: harnesssecure/upgrader
    pullPolicy: Always
    tag: "latest"
    digest: "sha256:4b846f7703c5ec39bc81896ccc03174f314a9c6eeb518a9fec977003eddaa6e5"
    imagePullSecrets: []
agentDockerImage:
  image:
    registry: docker.io
    repository: harnesssecure/gitops-agent
    pullPolicy: Always
    tag: "v0.118.0"
    digest: "sha256:3f91b057813ce87e813703591ecf38afac69a34620febbefff55d08cd1f92ef1"
    imagePullSecrets: []
redisHaConfigMapTestJob:
  image:
    registry: docker.io
    repository: harnesssecure/shellcheck
    pullPolicy: IfNotPresent
    tag: "v0.11.0"
    digest: "sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d"
    imagePullSecrets: []
  resources: {}
argoCDImage:
  image:
    registry: docker.io
    repository: harnesssecure/argocd
    pullPolicy: IfNotPresent
    tag: "v3.3.9"
    digest: "sha256:fd8a938f3ec64bfa272d17c20a56b548a97711b92bd5b0a80a485e81bc724969"
    imagePullSecrets: []
agentHAProxyImage:
  image:
    registry: docker.io
    repository: harnesssecure/haproxy
    pullPolicy: IfNotPresent
    tag: "3.2.14-alpine3.23"
    digest: "sha256:97157230e52aedafff46acf38bc4eee4da1e56d563c4963d51943b2f854fb24c"
    imagePullSecrets: []
agentRedisImage:
  image:
    registry: docker.io
    repository: harnesssecure/redis
    pullPolicy: IfNotPresent
    tag: "7.4.8"
    digest: "sha256:941b4aefb79b9b3ae7b756e4ec637a3a9699a788a25c4f883a62160033fecc1e"
    imagePullSecrets: []
sopsInstallerImage:
  image:
    registry: docker.io
    repository: harnesssecure/gitops-agent-installer-helper
    pullPolicy: IfNotPresent
    tag: "v0.0.15"
    digest: "sha256:cfe2819446771d125a75fd3fb72181717dfdce67fdb201060439a162d365e04e"
    imagePullSecrets: []
accessControlService:
  basePath: "api/"
  host: "access-control:9006"
  skipSecureVerify: "true"
  defaultSchemes: "http"
agent:
  protocol: "HTTP1"
  dockerImageRepo: "harnesssecure/gitops-agent"
  minimumV2Version: "0.33.0"
  enableAuth: "true"
  tlsEnabled: "false"
  customImage: "true"
certPath: ""
enableCDN: "false"
eventsFrameworkEnvNamespace: "free"
gitopsHttpAcme: "false"
gitopsTaskLongPolling: "true"
grpcPort: 7909
keyPath: ""
logFormat: ""
metricsPort: 6565
appSyncCompressJobEnabled: "false"
streamTimeout: 3600s
disableTransactionInReconcile: "true"
disableTransactionInCascadeDelete: "true"
applicationStreamEnabled: "true"
indexManagerMode: "REMOVE"
dbInitTimeoutInSeconds: "60"
timescale:
  certPath: ""
  dbName: "harness_gitops"
  logLevel: 3
  useTls: "false"
  password:
    name: harness-secrets
    key: timescaledbPostgresPassword
# this is config for harness ng-manager
platformService:
  url: "http://ng-manager:7090"
  skipSecureVerify: "true"
managerService:
  url: "http://harness-manager:9090/api"
  skipSecureVerify: "true"
#  this is config for harness platform-service
platformSvc:
  url: "http://platform-service:9005/api"
  skipSecureVerify: "true"
  auditsApiPath: "audit/api"
# this is config for harness policy-mgmt (OPA service)
opaService:
  url: "http://policy-mgmt:3000"
  skipSecureVerify: "true"
timescaledb:
  # -- TimescaleDB host names
  hosts: []
  # -- Enable TimescaleDB SSL
  # sslEnabled: false
  # -- TimescaleDB secrets
  secrets:
    kubernetesSecrets:
      - secretName: ""
        keys:
          TIMESCALEDB_USERNAME: ""
          TIMESCALEDB_PASSWORD: ""
          TIMESCALEDB_SSL_ROOT_CERT: ""
    secretManagement:
      externalSecretsOperator:
        - secretStore:
            name: ""
            kind: ""
          remoteKeys:
            TIMESCALEDB_USERNAME:
              name: ""
              property: ""
            TIMESCALEDB_PASSWORD:
              name: ""
              property: ""
            TIMESCALEDB_SSL_ROOT_CERT:
              name: ""
              property: ""
mongo:
  enableReflection: "true"
  dbName: "harness-gitops"
  dropAllIndexesOnce: "false"
database:
  mongo:
    harnessgitops:
      enabled: false
      protocol: ""
      hosts: []
      extraArgs: ""
      secrets:
        kubernetesSecrets:
          - secretName: ""
            keys:
              MONGO_USER: ""
              MONGO_PASSWORD: ""
        secretManagement:
          externalSecretsOperator:
            - secretStore:
                name: ""
                kind: ""
              remoteKeys:
                MONGO_USER:
                  name: ""
                  property: ""
                MONGO_PASSWORD:
                  name: ""
                  property: ""
  redis:
    events:
      masterName: "harness-redis"
      password:
        name: harness-secrets
        key: redisPassword
      sslCAPath: ""
      protocol: ""
      hosts: []
      extraArgs: ""
      sslEnabled: "false"
      secrets:
        kubernetesSecrets:
          - secretName: ""
            keys:
              REDIS_USERNAME: ""
              REDIS_PASSWORD: ""
        secretManagement:
          externalSecretsOperator:
            - secretStore:
                name: ""
                kind: ""
              remoteKeys:
                REDIS_USERNAME:
                  name: ""
                  property: ""
                REDIS_PASSWORD:
                  name: ""
                  property: ""
