probes:
  readinessProbe:
    httpGet:
      path: /api/v1/system/version
      port: code-http
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 2
  livenessProbe:
    httpGet:
      path: /api/v1/system/version
      port: code-http
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 2
resources:
  limits:
    memory: "1Gi"
  requests:
    cpu: "1024m"
    memory: "1Gi"
autoscaling:
  minReplicas: 2
  maxReplicas: 3
serviceAccount:
  create: true
  annotations: {}
  name: "code-api"
postgresPassword:
  name: postgres
  key: postgres-password
service:
  type: ClusterIP
  protocol: TCP
  port: 80
  sshPort: 3022
  annotations: {}
ingress:
  annotations: {}
  # kubernetes.io/ingress.class: nginx
  # kubernetes.io/tls-acme: "true"
  objects:
    - annotations:
        nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
        nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
        nginx.ingress.kubernetes.io/proxy-body-size: "32m"
        nginx.ingress.kubernetes.io/rewrite-target: /$2
        nginx.ingress.kubernetes.io/use-regex: "true"
      paths:
        - path: '{{ .Values.global.ingress.pathPrefix }}/code(/|$)(.*)'
    - annotations:
        nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
        nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
        nginx.ingress.kubernetes.io/proxy-body-size: "32m"
        nginx.ingress.kubernetes.io/rewrite-target: /uiv2/$2
        nginx.ingress.kubernetes.io/use-regex: "true"
      paths:
        - path: '{{ .Values.global.ingress.pathPrefix }}/codev2(/|$)(.*)'
    # temp routing for autoai module
    - annotations:
        nginx.ingress.kubernetes.io/rewrite-target: /autoai/$2
        nginx.ingress.kubernetes.io/use-regex: "true"
      paths:
        - path: '{{ .Values.global.ingress.pathPrefix }}/autoai(/|$)(.*)'
    # routing for aicr module
    - annotations:
        nginx.ingress.kubernetes.io/rewrite-target: /aicr/$2
        nginx.ingress.kubernetes.io/use-regex: "true"
      paths:
        - path: '{{ .Values.global.ingress.pathPrefix }}/aicr(/|$)(.*)'
