apiVersion: v1
kind: Service
metadata:
  name: {{ include "code-githa.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "code-githa.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: githa-grpc
    port: {{ .Values.config.CODE_GITHA_GRPC_SERVER_PORT }}
    targetPort: {{ .Values.config.CODE_GITHA_GRPC_SERVER_PORT }}
    protocol: TCP
  - name: githa-http
    port: {{ .Values.config.CODE_GITHA_HTTP_SERVER_PORT }}
    targetPort: {{ .Values.config.CODE_GITHA_HTTP_SERVER_PORT }}
    protocol: TCP
  {{- if .Values.prometheus.CODE_GITHA_PROMETHEUS_ENABLED }}
  - name: githa-metrics
    port: {{ .Values.prometheus.CODE_GITHA_PROMETHEUS_PORT }}
    targetPort: {{ .Values.prometheus.CODE_GITHA_PROMETHEUS_PORT }}
    protocol: TCP
  {{- end }}
  selector:
    app: {{ include "code-githa.name" . }}