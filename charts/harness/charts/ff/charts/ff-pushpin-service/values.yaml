postgres:
  enabled: false
  initialStoCoreDb: true
  database: ""
  ## - protocol to use for connection
  protocol: ""
  ## - host array for external
  hosts: []
  extraArgs: ""
  image:
    registry: docker.io
    repository: bitnami/postgresql
    pullPolicy: IfNotPresent
    tag: "14.9.0-debian-11-r60"
    digest: "sha256:3434dd0123c4338f50aeef2480df6a2a63d1e6d917c207c77d38b4479613ce61"
  secrets:
    kubernetesSecrets:
      - secretName: ""
        keys:
          POSTGRES_USER: ""
          POSTGRES_PASSWORD: ""
    secretManagement:
      externalSecretsOperator:
        - secretStore:
            name: ""
            kind: ""
          remoteKeys:
            POSTGRES_USER:
              name: ""
              property: ""
            POSTGRES_PASSWORD:
              name: ""
              property: ""
postgresPassword:
  name: postgres
  key: postgres-password
replicaCount: 1
maxSurge: 1
maxUnavailable: 0
progressDeadlineSeconds: 600
# security
podSecurityContext:
  fsGroup: 65534
  sysctls:
    - name: net.ipv4.ip_local_port_range
      value: 10240 65000
containerSecurityContext:
  allowPrivilegeEscalation: false
  runAsUser: 65534
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsGroup: 65534
image:
  registry: docker.io
  repository: harnesssecure/ff-pushpin-signed
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "1.1139.0"
  digest: "sha256:6379913d26178384c5572bb8749a18d3cc1c758e000231938ee4f4b90d2d813b"
  imagePullSecrets: []
resources:
  requests:
    memory: 500M
    cpu: 200m
    ephemeral-storage: 100M
  limits:
    memory: 500M
    ephemeral-storage: 100M
pushpinworker:
  image:
    registry: docker.io
    repository: harnesssecure/ff-pushpin-worker-signed
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: "1.1139.0"
    digest: "sha256:2151a350b3567952edba006cf43bca9f96f06d398c1e1c8ff96200ab604bf0fa"
    imagePullSecrets: []
  resources:
    limits:
      memory: 200M
      ephemeral-storage: 100M
    requests:
      cpu: 50m
      memory: 200M
      ephemeral-storage: 100M
configmap: {}
nameOverride: ""
timescaleSecret:
  password:
    name: harness-secrets
    key: timescaledbPostgresPassword
serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the name template
  name: "harness-default"
podAnnotations: {}
podLabels: {}
service:
  annotations: {}
  type: ClusterIP
  port: 7999
  targetport: 7999
  port17002: 17002
  targetport17002: 443
  port17003: 17003
  targetport17003: 5561
ingress:
  annotations: {}
  className: nginx
  objects:
    - annotations:
        nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
        nginx.ingress.kubernetes.io/use-regex: "true"
        nginx.ingress.kubernetes.io/rewrite-target: $1
      paths:
        - path: '{{ .Values.global.ingress.pathPrefix }}/sdk(/api/1.0/stream.*)'
          pathType: Prefix
virtualService:
  annotations: {}
  objects:
    - pathMatchType: prefix
      pathRewrite: "/api/1.0/stream"
      paths:
        - path: '{{ .Values.global.istio.virtualService.pathPrefix }}/sdk/api/1.0/stream'
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPU: 80
  targetMemory: 65
pdb:
  create: true
  minAvailable: "50%"
  # maxUnavailable: ""  # Use either minAvailable or maxUnavailable, not both
nodeSelector: {}
tolerations: []
affinity: {}
lifecycleHooks: {}
# lifecycleHooks:
#   postStart:
#     exec:
#       command:
#   preStop:
#     exec:
#       command:

# harness secrets
secrets:
  default: {}
  kubernetesSecrets:
    - secretName: ""
      keys: {}
  secretManagement:
    externalSecretsOperator:
      - secretStore:
          name: ""
          kind: ""
        remoteKeys: {}
config:
  target: "ff-client-server:80"
  CONNECTION_SUBSCRIPTION_MAX: "1000"
  DEBUG: "false"
  LOG_LEVEL: "1,pushpin-proxy:1"
  MAX_CONN: "99000"
  MAX_OPEN_REQUESTS: "6000"
  MESSAGE_RATE: "625"
  ZURL_IN_MESSAGE_QUEUE: "3000"
  ZURL_OUT_MESSAGE_QUEUE: "3000"
  http_port: "7999"
workerConfig:
  DB_DRIVER: "postgres"
  DB_NAME: "cf_db"
  DEBUG: "false"
  DEPLOY_MODE: "KUBERNETES_ONPREM"
  EVENT_BUS: "msg-broker"
  EVENTS_FRAMEWORK_REDIS_SENTINEL_MASTER: "harness-redis"
  EVENTS_FRAMEWORK_REDIS_SENTINEL_URLS: '{{ include "harnesscommon.dbv3.redisConnection" (dict "ctx" $ "database" "cf" "unsetProtocol" true) }}'
  EVENTS_FRAMEWORK_REDIS_SSL_ENABLED: "false"
  EVENTS_FRAMEWORK_USE_REDIS_PASSWORD: '{{ not .Values.global.database.redis.installed }}'
  EVENTS_FRAMEWORK_REDIS_USE_SENTINEL: '{{ .Values.global.database.redis.installed }}'
  LOG_LEVEL: "WARN"
  MSG_BROKER_PROVIDER: "redis"
  MSG_BROKER_URL: '{{ include "harnesscommon.dbv3.redisConnection" (dict "ctx" $ "database" "cf" "unsetProtocol" true) }}'
  REDIS_STREAM_APPROX_LENGTH: "true"
  REDIS_STREAM_BLOCKING_TIMEOUT: "10s"
  REDIS_STREAM_BUFFER_SIZE: "100"
  REDIS_STREAM_CONCURRENCY: "100"
  REDIS_STREAM_MAX_LENGTH: "10000"
  REDIS_STREAM_RECLAIM_INTERVAL: "5s"
  REDIS_STREAM_VISIBILITY_TIMEOUT: "5s"
