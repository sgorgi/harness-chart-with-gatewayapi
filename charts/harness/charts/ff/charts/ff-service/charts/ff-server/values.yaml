# application envs
config:
  ENV: dev
  LOG_LEVEL: INFO
  ADMIN_ENABLE: "false"
  CLIENT_ENABLE: "false"
  METRICS_ENABLE: "false"
  METRICS_PROCESSING: "false"
  CUSTOM_RULES_ENABLED: "true"
  FLAG_LIFECYCLE_MANAGEMENT_ENABLED: "true"
  GOMAXPROCS: '{{ .Values.resources.requests.cpu | quote }}'
  RETRIEVE_DIRECTLY_ADDED_RULES: "false"
  TARGET_ENVIRONMENT_INTERNAL_COUNT: ""
  ANALYTICS_DB_DRIVER: postgres
  ANALYTICS_DB_NAME: harnesscf
  ANALYTICS_DB_HOST: '{{ include "harnesscommon.dbconnectionv2.timescaleHost" (dict "context" $) }}'
  ANALYTICS_SSL_MODE: '{{ include "timescaleSSLMode" (dict "context" $) }}'
  ANALYTICS_DB_PORT: '{{ include "harnesscommon.dbconnectionv2.timescalePort" (dict "context" $) | default "5432" }}'
  DB_DRIVER: postgres
  DB_NAME: cf_db
  DB_MAX_CONNECTIONS: "30"
  DB_MAX_IDLE_CONNECTIONS: "10"
  DB_REPLICA_HOST: ""
  DB_REPLICA_PORT: '{{ include "harnesscommon.dbconnectionv2.postgresPort" (dict "context" $) | default "5432" }}'
  DB_REPLICA_MAX_CONNECTIONS: "30"
  DB_REPLICA_MAX_IDLE_CONNECTIONS: "10"
  REDIS_POOL_SIZE: "100"
  REDIS_CACHE_CLEAN_START_TIME: "12:00"
  REDIS_URL: '{{ include "harnesscommon.dbconnectionv2.redisConnection" (dict "context" $ "unsetProtocol" true) }}'
  REDIS_STREAM_MAX_LENGTH: "2048"
  REDIS_STREAM_APPROX_LENGTH: "true"
  REDIS_STREAM_VISIBILITY_TIMEOUT: "5s"
  REDIS_STREAM_BLOCKING_TIMEOUT: "10s"
  REDIS_STREAM_RECLAIM_INTERVAL: "5s"
  REDIS_STREAM_BUFFER_SIZE: "100"
  REDIS_STREAM_CONCURRENCY: "100"
  EVENT_BUS: msg-broker
  EVENTS_FRAMEWORK_REDIS_SENTINEL_URLS: '{{ include "harnesscommon.dbconnectionv2.redisConnection" (dict "context" $ "unsetProtocol" true) }}'
  EVENTS_FRAMEWORK_REDIS_ENV: cf
  EVENTS_FRAMEWORK_USE_REDIS_PASSWORD: '{{ not .Values.global.database.redis.installed }}'
  EVENTS_FRAMEWORK_REDIS_USE_SENTINEL: '{{ .Values.global.database.redis.installed }}'
  EVENTS_FRAMEWORK_REDIS_SENTINEL_MASTER: harness-redis
  MSG_BROKER_PROVIDER: redis
  MSG_BROKER_URL: '{{ include "harnesscommon.dbv3.redisConnection" (dict "ctx" $ "database" "events" "unsetProtocol" true) }}'
  USE_CF_REDIS: '{{ not .Values.global.database.redis.installed }}'
  CF_REDIS_URL: '{{ include "harnesscommon.dbv3.redisConnection" (dict "ctx" $ "database" "cf" "unsetProtocol" true) }}'
  CF_REDIS_USE_PASSWORD: '{{ not .Values.global.database.redis.installed }}'
  CF_REDIS_POOL_SIZE: "500"
  CF_REDIS_SENTINEL_MASTER: harness-redis
  CF_REDIS_SENTINEL_URLS: '{{ include "harnesscommon.dbconnectionv2.redisConnection" (dict "context" $ "unsetProtocol" true) }}'
  CF_REDIS_USE_SENTINEL: '{{ .Values.global.database.redis.installed }}'
  CF_REDIS_USE_TLS: "false"
  METRICS_REDIS_USE_PASSWORD: '{{ not .Values.global.database.redis.installed }}'
  METRICS_REDIS_URL: '{{ include "harnesscommon.dbv3.redisConnection" (dict "ctx" $ "database" "cfmetrics") }}'
  METRICS_REDIS_USE_SENTINEL: '{{ .Values.global.database.redis.installed }}'
  METRICS_REDIS_SENTINEL_URLS: '{{ include "harnesscommon.dbconnectionv2.redisConnection" (dict "context" $ "unsetProtocol" true) }}'
  METRICS_REDIS_SENTINEL_MASTER: harness-redis
  ACCESS_CONTROL_SERVICE: 'http://access-control.{{ .Release.Namespace }}.svc.cluster.local:9006'
  ACCESS_CONTROL_BASE_PATH: /api
  AIDA_BASE_API: 'http://genai-service.{{ .Release.Namespace }}.svc.cluster.local:8000'
  CACHE_PROVIDER_URLS: '{{ include "harnesscommon.dbconnectionv2.redisConnection" (dict "context" $ "unsetProtocol" true) }}'
  FF_CLIENT_SERVICE_URL: ""
  FF_METRICS_SERVICE_URL: ""
  GIT_SYNC_URL: "ng-manager.{{ .Release.Namespace }}.svc.cluster.local:13002"
  GIT_SYNC_AUTHORITY: "ng-manager.{{ .Release.Namespace }}.svc.cluster.local:13002"
  GIT_SYNC_ENABLED: "true"
  GIT_SYNC_SERVER_USE_SSL: "false"
  GIT_SYNC_WEBHOOK_LISTEN_ADDR: 0.0.0.0:15002
  GIT_SYNC_WEBHOOK_ENABLED: "false"
  GRIP_URL: 'http://pushpin.{{ .Release.Namespace }}.svc.cluster.local:5561'
  JIRA_BASE_URL: https://harness.io/gateway/cf/jira
  PIPELINE_BASE_URL: 'http://pipeline-service.{{ .Release.Namespace }}.svc.cluster.local:12001/api'
  PLATFORM_INTEGRATION_ENABLED: "true"
  PLATFORM_BASE_URL: 'http://ng-manager.{{ .Release.Namespace }}.svc.cluster.local:7090'
  PLATFORM_BASE_API: 'http://platform-service.{{ .Release.Namespace }}.svc.cluster.local:9005'
  PLATFORM_SERVICE_URL: 'http://platform-service.{{.Release.Namespace}}.svc.cluster.local:9005'
  POLICY_MGMT_ENABLED: "true"
