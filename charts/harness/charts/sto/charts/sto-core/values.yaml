    registry: docker.io
    repository: harnesssecure/postgresql
    pullPolicy: IfNotPresent
    tag: "14.18.0-debian-12-r0"
    digest: "sha256:7e642b2493706b02134fa621f1d326b1c7451d0145e205012c1bcd3c01c78e03"
  secrets:
    kubernetesSecrets:
      - secretName: ""
        keys:
          POSTGRES_USER: ""
          POSTGRES_PASSWORD: ""
    secretManagement:
      externalSecretsOperator:
        - secretStore:
            name: ""
            kind: ""
          remoteKeys:
            POSTGRES_USER:
              name: ""
              property: ""
            POSTGRES_PASSWORD:
              name: ""
              property: ""
migrationPostgres:
  enabled: false
  database: ""
  ## - protocol to use for connection
  protocol: ""
  ## - host array for external
  hosts: []
  extraArgs: ""
  image:
    registry: docker.io
    repository: harnesssecure/postgresql
    pullPolicy: IfNotPresent
    tag: "14.18.0-debian-12-r0"
    digest: "sha256:7e642b2493706b02134fa621f1d326b1c7451d0145e205012c1bcd3c01c78e03"
  secrets:
    kubernetesSecrets:
      - secretName: ""
        keys:
          POSTGRES_USER: ""
          POSTGRES_PASSWORD: ""
    secretManagement:
      externalSecretsOperator:
        - secretStore:
            name: ""
            kind: ""
          remoteKeys:
            POSTGRES_USER:
              name: ""
              property: ""
            POSTGRES_PASSWORD:
              name: ""
              property: ""
service:
  annotations: {}
  type: ClusterIP
  port: 4000
virtualService:
  annotations: {}
  objects:
    - name: sto-core-apis
      pathMatchType: prefix
      pathRewrite: "/"
      paths:
        - path: '{{ .Values.global.istio.virtualService.pathPrefix }}/sto/'
ingress:
  objects:
    - name: sto-core
      annotations:
        nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
        nginx.ingress.kubernetes.io/rewrite-target: /$2
        nginx.ingress.kubernetes.io/use-regex: "true"
      paths:
        - path: '{{ .Values.global.ingress.pathPrefix }}/sto(/|$)(.*)'
resources:
  limits:
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 768Mi
autoscaling:
  enabled: false
  targetCPU: 75
  targetMemory: 65
nodeSelector: {}
tolerations: []
affinity: {}
