apiVersion: v1
kind: Service
metadata:
  name: ticket-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ticket-service.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "ticket-service.selectorLabels" . | nindent 4 }}
