        - path: '{{ .Values.global.ingress.pathPrefix }}/(v1/org/.+/project/.+/enforcement/.+/summary)'
        - path: '{{ .Values.global.ingress.pathPrefix }}/(v1/org/.+/project/.+/enforcement/.+/policy-violations)'
        - path: '{{ .Values.global.ingress.pathPrefix }}/(v1/org/.+/project/.+/enforcement-result)'
        - path: '{{ .Values.global.ingress.pathPrefix }}/(v1/org/.+/project/.+/enforcement-summary)'
        - path: '{{ .Values.global.ingress.pathPrefix }}/(v1/org/.+/project/.+/normalised-sbom-component)'
        - path: '{{ .Values.global.ingress.pathPrefix }}/(v1/orgs/.+/projects/.+/remediations.*)'
        - path: '{{ .Values.global.ingress.pathPrefix }}/(v1/orgs/.+/projects/.+/exemptions.*)'
        - path: '{{ .Values.global.ingress.pathPrefix }}/(v1/token)'
        - path: '{{ .Values.global.ingress.pathPrefix }}/(v1/custom/oidc-token)'
        - path: '{{ .Values.global.ingress.pathPrefix }}/(v1/version)'
        - path: '{{ .Values.global.ingress.pathPrefix }}/(v1/orgs/.+/projects/.+/ai-workflow-executions)'
        - path: '{{ .Values.global.ingress.pathPrefix }}/(v1/orgs/.+/projects/.+/ai-workflow-executions/.+/steps)'
        - path: '{{ .Values.global.ingress.pathPrefix }}/(v1/orgs/.+/projects/.+/artifacts/.+/components/ticket)'
        - path: '{{ .Values.global.ingress.pathPrefix }}/(v1/orgs/.+/projects/.+/integration/integration-summary)'
        - path: '{{ .Values.global.ingress.pathPrefix }}/(v1/orgs/.+/projects/.+/sbom-score)'
        - path: '{{ .Values.global.ingress.pathPrefix }}/(v1/orgs/.+/projects/.+/sbom-attestation-upload)'
