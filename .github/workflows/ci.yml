name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Helm ${{ matrix.helm-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        helm-version:
          - v3.19.0
          - v4.2.3

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4  # v4.3.1
        with:
          version: ${{ matrix.helm-version }}

      - name: Verify toolchain
        run: |
          helm version --short
          shellcheck --version

      - name: Run static checks
        run: |
          bash -n scripts/test scripts/fetch-platform-chart \
            scripts/generate-gateway-api tests/render_contract_test.sh
          shellcheck -s bash scripts/test scripts/fetch-platform-chart \
            scripts/generate-gateway-api tests/render_contract_test.sh

      - name: Lint chart
        run: helm lint . --strict

      - name: Run render contract tests
        run: ./scripts/test

      - name: Verify packaged chart
        shell: bash
        run: |
          set -euo pipefail
          package_dir=$(mktemp -d)
          helm package . --destination "$package_dir"
          archive=$(find "$package_dir" -type f -name '*.tgz' -print -quit)
          members=$(tar -tzf "$archive")

          grep -Fqx 'harness-gateway-api/LICENSE' <<<"$members"
          grep -Fqx 'harness-gateway-api/NOTICE' <<<"$members"
          grep -Fqx 'harness-gateway-api/scripts/generate-gateway-api' <<<"$members"
          grep -Fqx 'harness-gateway-api/scripts/ingress-converter/Chart.yaml' <<<"$members"
          grep -Fqx 'harness-gateway-api/templates/backendtrafficpolicies.yaml' <<<"$members"
          grep -Fqx 'harness-gateway-api/CONTRIBUTING.md' <<<"$members"
          grep -Fqx 'harness-gateway-api/SECURITY.md' <<<"$members"
          grep -Fqx 'harness-gateway-api/SUPPORT.md' <<<"$members"
          grep -Fqx 'harness-gateway-api/UPSTREAM.md' <<<"$members"

          if grep -Eq '/(platform|tests|\.github|generated)/|/scripts/(test|fetch-platform-chart)$' <<<"$members"; then
            printf 'Repository-only content found in packaged chart:\n' >&2
            grep -E '/(platform|tests|\.github|generated)/|/scripts/(test|fetch-platform-chart)$' <<<"$members" >&2
            exit 1
          fi
