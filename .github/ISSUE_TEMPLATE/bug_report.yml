name: Bug report
description: Report a reproducible problem in the overlay or generator.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Do not include credentials, private
        keys, internal domains, customer data, or production manifests.

  - type: input
    id: overlay-version
    attributes:
      label: Overlay version
      placeholder: 0.3.0 or commit SHA
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Component versions
      description: Include Helm, Harness Platform, Envoy Gateway, Gateway API, Kubernetes, and Cilium versions as applicable.
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: Explain the observed behavior and the expected behavior.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide a minimal reproduction using sanitized placeholder values.
      render: shell
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Sanitized output
      description: Include relevant errors or rendered resources after removing sensitive information.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I have removed all secrets and private infrastructure information.
          required: true
        - label: I confirmed that this issue belongs to the overlay rather than an upstream project.
          required: true
