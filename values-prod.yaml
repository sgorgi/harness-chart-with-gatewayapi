# GENERATOR-ONLY SOURCE RENDER INPUT: the reusable templates use
# .Release.Namespace at deployment time. This value only selects the namespace
# for the temporary Ingress render and can instead be passed with --namespace.
deployment:
  namespace: harness-prod

# STANDALONE FIXTURE / UPSTREAM HARNESS INPUT: do not blindly copy this block.
# Merge the equivalent hostname, certificate, and external URL settings into the
# consuming repository's existing Harness values. They are also the source from
# which the generator discovers listeners and TLS references.
harness:
  global:
    ingress:
      hosts:
        - harness.example.com
      tls:
        secretName: harness-prod-tls
    loadbalancerURL: https://harness.example.com
