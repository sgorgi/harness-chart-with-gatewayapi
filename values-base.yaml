# This file contains only switches introduced by this overlay. Supply the
# existing Harness platform values first so hostnames, TLS Secrets and feature
# flags remain owned by the Harness configuration:
#
#   helm template harness-gateway-api . \
#     --namespace <harness-namespace> \
#     -f <existing-platform-values>.yaml \
#     -f values-base.yaml

harnessGatewayOverlay:
  enabled: true

  # Enable only after confirming that Envoy data-plane pods run in
  # envoy-gateway-apps and carry the owning-Gateway labels used by the policy.
  ciliumNetworkPolicy:
    enabled: false
