# This file contains only switches introduced by this overlay. Environment
# hostnames, TLS Secret names, paths and backends are discovered from the
# Ingress resources rendered with the target environment's Harness values.

harnessGatewayOverlay:
  enabled: true

  # Enable only after confirming that Envoy data-plane pods run in
  # envoy-gateway-apps and carry the owning-Gateway labels used by the policy.
  ciliumNetworkPolicy:
    enabled: false
